# Bun's transpiler does not pick up jsx/jsxImportSource from the nested
# src/test/bun/tsconfig.json (tsc does), so the react JSX runtime is pinned
# here. src/webview/tsconfig.json and scripts/dev/bundle.mts pin it too; all
# three must agree. @types/bun tracks the packageManager bun version.
jsx = "react-jsx"
jsxImportSource = "react"

# `root` is load-bearing: without it a bare `bun test` discovers the
# extension-host *.test.ts files, whose suite()/test() globals crash under
# bun's runner. src/test/bun is the only bun-test surface in this repository.
[test]
root = "src/test/bun"
preload = ["./src/test/bun/preload.ts"]
