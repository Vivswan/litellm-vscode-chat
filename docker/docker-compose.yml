# Local LiteLLM test stack: a real LiteLLM proxy in front of a fake OpenAI
# backend (canned scenario responses) plus optional real providers.
# Podman-compatible: fully qualified images, compose-spec features only.
# On SELinux hosts, change the bind mounts from :ro to :ro,z.

services:
  fake-openai:
    image: docker.io/oven/bun:1.4.0-alpine
    command: ["bun", "/app/scripts/stack/fake-openai-server.ts"]
    working_dir: /app
    volumes:
      - .:/app:ro
    # Mask the Copilot token dir out of the repo mount: this container has no
    # business reading a credential. tmpfs, not an anonymous volume: recreates
    # can leave anonymous volumes behind as empty orphans (they accumulate),
    # while a tmpfs mount leaves nothing to clean up.
    tmpfs:
      - /app/docker/.copilot-token
    environment:
      # Explicit rather than relying on the server's default; must stay equal
      # to FAKE_BACKEND_PORT in src/test/fakeStack/proxyConfig.ts (as must the
      # mapping and healthcheck below) - stackDrift.test.ts pins all three.
      PORT: "8080"
      # The dev launcher sets FAKE_VERBOSE=1 so the container log carries every
      # chat request and response body; the test orchestrator leaves it off.
      FAKE_VERBOSE: ${FAKE_VERBOSE:-}
    ports:
      # Loopback only: this port exposes unauthenticated test controls.
      - "127.0.0.1:${FAKE_OPENAI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      # Fast checks only during startup (start_interval needs Docker 25+;
      # engines without it fall back to the steady interval, costing one
      # slower stack start); 30s afterwards keeps the container log quiet.
      interval: 30s
      start_interval: 2s
      start_period: 30s
      timeout: 2s
      retries: 15

  postgres:
    # LiteLLM's spend/budget endpoints (/key/info, /user/daily/activity) only
    # exist on a database-backed proxy; this is that database. No host port:
    # only the litellm container talks to it, so the throwaway credentials
    # below never leave the compose network (they are not secrets).
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
    # tmpfs instead of the image's declared volume (docker skips the
    # anonymous volume when a mount covers its path): any restart or
    # recreate of this container provably starts from an empty database
    # (deterministic test runs; note that only the stack-starting scripts
    # reseed the usage fixture key), and `down` leaves nothing behind.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 3s
      retries: 15

  litellm:
    # The -database flavor of the same version: identical proxy, plus the
    # bundled prisma client its entrypoint uses to migrate the schema above.
    image: ghcr.io/berriai/litellm-database:v1.99.1
    command: ["--config", "/app/generated/litellm-config.yaml", "--port", "4000"]
    volumes:
      # The directory is mounted rather than the file: a missing bind-mounted
      # file would be silently created as a directory by the container
      # runtime. scripts/stack/compose.ts and scripts/docker-test.ts regenerate the
      # config inside it before every start.
      - ./docker/.generated:/app/generated:ro
      # GitHub Copilot device-flow login, seeded by `bun run copilot-login`;
      # read-only, with the provider's short-lived key cache redirected to
      # container-local /tmp via GITHUB_COPILOT_API_KEY_FILE below.
      - ./docker/.copilot-token:/copilot-token:ro
    ports:
      # Loopback only: with real provider keys in .env, an exposed proxy
      # would let anyone on the network spend those credentials.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    depends_on:
      fake-openai:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-test-1234}
      # Same throwaway credentials as the postgres service above; enables the
      # DB-backed spend/budget endpoints the docker-usage suite exercises.
      DATABASE_URL: postgresql://litellm:litellm@postgres:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_COPILOT_TOKEN_DIR: /copilot-token
      # Absolute, so the authenticator's os.path.join resolves it OUTSIDE the
      # read-only token dir; the cache is per-container and disposable. A
      # version-coupled bet on the image tag above: it relies on the
      # authenticator joining this value without validating it.
      GITHUB_COPILOT_API_KEY_FILE: /tmp/github-copilot-api-key.json
      # DEBUG mirrors litellm's own unset default (getenv fallback in
      # litellm/_logging.py); an empty value would crash the proxy at boot
      # (getattr(logging, "")). Set ERROR or INFO to quiet the proxy log.
      LITELLM_LOG: ${LITELLM_LOG:-DEBUG}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      # Docker runs the interval FOREVER, not just at startup, and every check
      # prints an access-log line in the proxy log. start_interval keeps the
      # startup gate fast (Docker 25+; older engines fall back to the steady
      # interval); 30s steady-state keeps the dev log readable. The start
      # period covers the entrypoint's prisma migration against a fresh
      # postgres, which runs before the proxy starts answering.
      interval: 30s
      start_interval: 3s
      timeout: 5s
      retries: 30
      start_period: 90s
