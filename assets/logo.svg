<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>LiteLLM VS Code Chat</title>
  <!--
    Rebuilt as vectors from the 1024 px raster the project shipped until 2026-10, each primitive fitted to that
    raster: the disc measures 706.6 by 700.2 px there, hence the ellipse, and its gradient is not linear in sRGB,
    hence the sampled stops. bun run icon:render writes assets/logo.png from it.
  -->
  <defs>
    <linearGradient id="disc" gradientUnits="userSpaceOnUse" x1="282.76" y1="775.1" x2="741.9" y2="242.81">
      <stop offset="0.000" stop-color="#635fff"/>
      <stop offset="0.125" stop-color="#695eff"/>
      <stop offset="0.250" stop-color="#725dff"/>
      <stop offset="0.375" stop-color="#7d5cff"/>
      <stop offset="0.500" stop-color="#8a5bff"/>
      <stop offset="0.625" stop-color="#985bff"/>
      <stop offset="0.750" stop-color="#a75cfd"/>
      <stop offset="0.875" stop-color="#b55dfb"/>
      <stop offset="1.000" stop-color="#c15ff8"/>
    </linearGradient>
    <mask id="circuit" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
      <circle cx="512.75" cy="284.5" r="27"/>
      <circle cx="353.25" cy="348.25" r="27"/>
      <circle cx="299" cy="504" r="27"/>
      <circle cx="678.5" cy="366" r="27"/>
      <circle cx="726" cy="505" r="27"/>
      <circle cx="676.5" cy="659" r="27"/>
      <circle cx="512.5" cy="738.5" r="27"/>
      <circle cx="355" cy="654.5" r="27"/>
      </g>
      <g fill="none" stroke="#000" stroke-width="16.5" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-linejoin="miter" d="M 512.75 284.5 V 378.39 C 427.87 407.85 429.18 450.9 394.27 504 H 299"/>
      <line x1="353.25" y1="348.25" x2="433.75" y2="428.75"/>
      <path stroke-linejoin="miter" d="M 512.5 738.5 V 646.77 C 602.66 594.11 616.87 595.86 646.78 505 H 726"/>
      <line x1="676.5" y1="659" x2="606.96" y2="589.46"/>
      <line x1="678.5" y1="366" x2="605.31" y2="439.19"/>
      <line x1="355" y1="654.5" x2="427.12" y2="582.38"/>
      </g>
      <path fill="#000"
        d="M 390.23 536.93 A 6.75 6.75 0 0 0 395.45 548.29 L 470.64 544.94 A 6.75 6.75 0 0 1 477.28 554 L
