        477.64 A 6.75 6.75 0 0 1 552.1 468.56 L 603.85 328.18 A 6.75 6.75 0 0 0 592.59 321.23 Z"/>
    </mask>
  </defs>
  <ellipse cx="512.33" cy="508.95" rx="353.31" ry="350.1" fill="url(#disc)" mask="url(#circuit)"/>
</svg>
