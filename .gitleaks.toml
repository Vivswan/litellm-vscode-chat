# Gitleaks config for the scheduled full-history scan in the managed ci.yml.
# Keeps the complete default ruleset (useDefault) and allowlists known false
# positives narrowly, by the exact matched secret - never by path, so real
# credentials in test files still get flagged.

[extend]
useDefault = true

# [allowlist] (singular) rather than [[allowlists]]: the plural table only
# arrived in gitleaks 8.25.0 and the gitleaks-action's bundled version predates
# it; the singular form works on both.
[allowlist]
description = "Test fixture simulating VS Code's internal underscore-prefixed modelOptions fields; trips the generic-api-key entropy rule"
regexTarget = "secret"
regexes = ['''^test-correlation-id-12345$''']
