# Repo-owned gitleaks config, read by the CI gitleaks job (and local
# `gitleaks git` runs). Seeded once by repo-platform's template and never
# overwritten by sync, so allowlists added here survive updates.
# [extend] pulls in gitleaks' default ruleset - without it, this file
# would REPLACE the defaults and disable every stock rule.
# minVersion is honored only by binaries new enough to know it (an older
# one skips the check silently), so the CI job pins GITLEAKS_VERSION to a
# release meeting the floor.
minVersion = "8.30.1"

[extend]
useDefault = true

# Generated lockfiles: integrity hashes occasionally trip the generic
# entropy rules, and secrets do not belong in generated files.
[[allowlists]]
description = "generated lockfiles"
paths = ['''(^|/)(bun\.lock|bun\.lockb)$''']

# Add further false-positive allowlists here; for a one-off finding,
# prefer an inline "gitleaks:allow" comment on the flagged line -
# finding-level, so it never excuses future secrets in the same file.

# A test-fixture correlation id trips the generic-api-key entropy rule in
# historical commits (8aa7fb00, e66bb318), where an inline gitleaks:allow
# comment cannot reach; the line at HEAD carries one instead. Matched
# against the exact extracted secret, so real credentials in test files
# still get flagged.
[[allowlists]]
description = "historical test-fixture correlation id"
regexTarget = "secret"
regexes = ['''^test-correlation-id-12345$''']

# Historical docs curl examples (commits 284cfb6c, 83dd7bb2) used the
# literal placeholder "sk-your-key", tripping curl-auth-header; HEAD now
# uses $YOUR_LITELLM_KEY, which the rule ignores. Matched against the
# exact extracted secret, so a real key in a curl example still flags.
# Do not add a paths criterion here: gitleaks ORs allowlist criteria, so
# paths would excuse ANY secret under those paths, not narrow this one.
[[allowlists]]
description = "historical docs placeholder key in curl examples"
regexTarget = "secret"
regexes = ['''^sk-your-key$''']
