# Local LiteLLM test stack: a real LiteLLM proxy in front of a fake OpenAI
# backend (canned scenario responses) plus optional real providers.
# Podman-compatible: fully qualified images, compose-spec features only.
# On SELinux hosts, change the bind mounts from :ro to :ro,z.

services:
  fake-openai:
    image: docker.io/oven/bun:1.3.9-alpine
    command: ["bun", "/app/scripts/fake-openai-server.ts"]
    working_dir: /app
    volumes:
      - .:/app:ro
    ports:
      # Loopback only: this port exposes unauthenticated test controls.
      - "127.0.0.1:${FAKE_OPENAI_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./docker/litellm-config.yaml:/app/config.yaml:ro
    ports:
      # Loopback only: with real provider keys in .env, an exposed proxy
      # would let anyone on the network spend those credentials.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    depends_on:
      fake-openai:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-test-1234}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
