# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # One PR per cycle for all action bumps, not one PR per action.
    groups:
      actions:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Conventional PR titles so the commit-names/pr-title gates pass; action
    # bumps are workflow changes, hence ci (package-manifest entries use build).
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
