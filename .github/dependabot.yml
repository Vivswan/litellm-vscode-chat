# This file is managed by Vivswan/repo-platform.
# Local edits are replaced on the next sync.

version: 2
updates:
  - package-ecosystem: "github-actions"
    # Dependabot expands a glob with Ruby's Dir.glob, and reads a directory for the YAML files directly in it.
    #   /                      -> .github/workflows and a root action file, its one special case
    #   /.github/actions/**/*  -> the folder and every directory under it, at any depth (`**` alone: one level)
    # A matched directory with no YAML file is skipped, and a glob matching nothing adds no directory.
    directories:
      - "/"
      - "/.github/actions/**/*"
    # One PR per cycle for all action bumps, not one PR per action.
    groups:
      actions:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Conventional PR titles so the commit-names/pr-title gates pass; action
    # bumps are workflow changes, hence ci (package-manifest entries use build).
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "bun"
    directory: "/"
    # One PR per cycle for all bun bumps, not one PR per package.
    groups:
      bun:
        patterns: ["*"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
