# Repo-owned: seeded once by Vivswan/repo-platform, never overwritten by sync. repo-platform's reusable-site.yml runs
# it only when this file exists, inside the deploy job's own workspace, so dist is handed over with no artifact hop.

name: Site Build
description: |
  Builds this repository's own website for the fleet's Pages deploy.

  The fleet's deploy job runs it on the judged commit and assembles the Pages site from its dist output and docs/.
  Until the build step is filled in, it names no directory and docs/ publishes alone.

  The caller's obligations:
    - pass base-path and origin, both required
    - run it from a checkout of the judged commit
    - grant the deploy job's token: contents read, pages and id-token write, issues write
    - have bash on PATH

  The dist output names the built site's directory, relative to the repository root, holding an index.html.
  Empty means no repository website.

  Contract and examples: repo-platform's docs/modules/site.md.

inputs:
  base-path:
    description: The URL path the site is served under ("/" with a custom domain, else "/<repo>/").
    required: true
  origin:
    description: The site's origin (https://<owner>.github.io, or https://<domain>).
    required: true

outputs:
  dist:
    description: The built site's directory, relative to the repository root, or empty for no repository website.
    value: ${{ steps.build.outputs.dist }}

runs:
  using: composite
  steps:
    # A bun repository replaces the no-op step below with, for example:
    #   - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    #     with: {bun-version-file: .bun-version}
    #   - {run: bun install --frozen-lockfile, shell: bash}
    #   - id: build
    #     shell: bash
    #     env: {PAGES_BASE_PATH: "${{ inputs.base-path }}", PAGES_ORIGIN: "${{ inputs.origin }}"}
    #     run: |
    #       bun run build:web
    #       echo "dist=apps/web/dist" >> "$GITHUB_OUTPUT"
    - id: build
      shell: bash
      run: |
        echo "site-build hook: no repository site configured; docs/ publishes alone when present"
        echo "dist=" >> "$GITHUB_OUTPUT"
