rulesets:
  - name: pr-title
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: true
          required_status_checks:
            - context: pr-title
              integration_id: 15368
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
    rules:
      - type: code_quality
        parameters:
          severity: warnings
      - type: copilot_code_review
        parameters:
          review_on_push: true
          review_draft_pull_requests: true
      - type: code_scanning
        parameters:
          code_scanning_tools:
            - tool: CodeQL
              security_alerts_threshold: high_or_higher
              alerts_threshold: errors_and_warnings
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: true
          required_status_checks:
            - context: all-green
              integration_id: 15368
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: true
          require_last_push_approval: false
          required_review_thread_resolution: true
          allowed_merge_methods:
            - squash
  - name: release-tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
          - v*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always
  - name: non-bypassable
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: deletion
      - type: required_linear_history
    bypass_actors: []
