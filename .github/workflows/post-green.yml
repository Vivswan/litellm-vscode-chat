# Repo-owned: generated once by Vivswan/repo-platform, never
# overwritten by sync. Called after the all-green gate on every green push
# to main, before the release: REPLACE the no-op job with this repository's
# work (it uses a runner allocation per push until you do; the contract is in
# repo-platform's docs/all-green.md, "After the gate"). Jobs here run for the
# LATEST green main, not every commit (ci.yml's concurrency group cancels a
# superseded pending run): act on the repository's current state, never on
# "what this commit changed", and stay idempotent.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ inputs.sha }}
        run: echo "post-green hook for $SHA - nothing configured"
