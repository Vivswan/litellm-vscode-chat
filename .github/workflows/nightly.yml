# Nightly high-iteration fuzz run against the dockerized LiteLLM stack:
# 1000 property-test runs per suite and 500 generated streams through the
# real proxy, with a fresh random seed each night. A failing run uploads its
# logs and files (or updates) a "nightly-fuzz" issue carrying the seed, so
# the failure reproduces locally with:
#   FUZZ_SEED=<seed> bun run test:docker

name: Nightly Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: '59 7 * * *'

# Scheduled runs supersede an in-flight scheduled run, but every manual
# dispatch gets its own group so several fuzz passes (each with its own
# random seed) can run side by side.
concurrency:
  group: nightly-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/setup-env.sh

      - name: Run the unit suite with high-iteration property tests
        shell: bash
        run: xvfb-run -a bun run test 2>&1 | tee nightly-unit.log
        env:
          FUZZ_RUNS: '1000'

      - name: Run the docker stack suites with the stream fuzzer
        shell: bash
        run: xvfb-run -a bun run test:docker 2>&1 | tee nightly-docker.log
        env:
          FUZZ_RUNS: '1000'
          FUZZ_ITERATIONS: '500'

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fuzz-logs-${{ github.run_attempt }}
          path: nightly-*.log

      - name: File or update the nightly-fuzz issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          seed="$(grep -oE '\[fuzz\] seed=[0-9]+' nightly-docker.log | tail -1 | grep -oE '[0-9]+' || true)"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Nightly fuzz run failed: ${run_url}"
            echo
            if [ -n "$seed" ]; then
              echo "The fuzz stage of this run used seed ${seed}. If the failure is in the"
              echo "seeded fuzzer (and not a later suite or teardown), reproduce locally with:"
              echo
              echo '```bash'
              echo "FUZZ_SEED=${seed} FUZZ_RUNS=1000 FUZZ_ITERATIONS=500 bun run test:docker"
              echo '```'
            else
              echo "The run failed before the seeded fuzzer started."
            fi
            echo
            echo "Full logs are attached to the run as the nightly-fuzz-logs artifact."
          } > issue-body.md
          gh label create nightly-fuzz --description "Automated nightly fuzz failure" --color B60205 --repo "${{ github.repository }}" 2>/dev/null || true
          existing="$(gh issue list --repo "${{ github.repository }}" --label nightly-fuzz --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body-file issue-body.md
          else
            gh issue create --repo "${{ github.repository }}" --title "Nightly fuzz failure (seed ${seed:-unknown})" --label nightly-fuzz --body-file issue-body.md
          fi
