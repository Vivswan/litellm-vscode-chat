# Nightly drift probes. Generated once by the fleet sync and never
# overwritten by it, so edit freely; the report job below keeps working
# unchanged - a red night files or updates one label-deduplicated tracking
# issue, a green night closes it (the fleet's docs/nightly.md has the
# contract).
#
# The PR gate (checks.yml) runs the test jobs on the stable VS Code of the
# day and on the LiteLLM image docker-compose.yml pins. Nothing in a PR can
# tell us what the next VS Code release or the next LiteLLM stable will do.
# Each job here is the same reusable test job with one input moved ahead:
#
#   vscode-insiders  the host suites on VS Code Insiders. Red points at the
#                    extension host API moving under us before it reaches
#                    stable (engines.vscode, @types/vscode, or the code).
#   litellm-stable   the docker suites on LiteLLM's rolling main-stable tag,
#                    the proxy a user pulling `latest` runs. Red points at a
#                    response shape, status code, or endpoint the suites pin.
#
# A red night can also be a download or image pull that failed; the run log
# says which. Either way it is lead time: fix before the change reaches
# stable VS Code, or before the LiteLLM pin is bumped.
name: Nightly

on:
  schedule:
    # Overnight US-Eastern, off the top of the hour, and offset from the
    # fuzzer starter; pick your repo's own minute so the fleet's nightlies
    # do not all land on GitHub at once.
    - cron: "59 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# The probe jobs need only the checkout; the report job scopes its own
# issue permission below.
permissions:
  contents: read

jobs:
  vscode-insiders:
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'ubuntu-latest'
      vscode-version: 'insiders'

  # Same image repository as the pin, so the tag is the only variable.
  # main-latest would also page on LiteLLM's own unreviewed dev builds.
  litellm-stable:
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'ubuntu-latest'
      suite: 'docker'
      litellm-image: 'ghcr.io/berriai/litellm-database:main-stable'

  # Runs whatever happened to the probe jobs, and treats a CANCELLED job as
  # red: a job that hits its timeout is cancelled, not failed, and a hang is
  # exactly what a nightly run exists to catch. The conditions read every
  # result in `needs`, so a new probe is one more entry there and nothing
  # else; probes carry no `if:`, so a skipped result cannot occur.
  report:
    needs: [vscode-insiders, litellm-stable]
    if: always()
    runs-on: ubuntu-latest
    # A few gh calls behind a bun setup; a hung reporter is the residual
    # silence window, so keep this tight.
    timeout-minutes: 5
    # issues: write lets the fuzz-issue action file/close the tracking issue.
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "nightly-failure"
          title: Nightly CI failures
          # No artifacts directory is passed: this stream files the generic
          # nightly-failure report (workflow, commit, run link) rather than
          # the fuzzer's failure-report contract. The tuple below is used
          # only when the label has to be created and matches the
          # settings-sync declaration.
          label-color: "D93F0B"
          label-description: Automated nightly CI failure
          stream: generic

      - name: Close the nightly issue on a green night
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "nightly-failure"
          # The generic close wording; without it the action keeps the fuzz
          # stream's regression-seed hedging.
          stream: generic
