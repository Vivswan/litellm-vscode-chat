# The release-PR hook of the release pipeline: repo-owned, generated once
# by Vivswan/repo-platform and never overwritten by template sync. The
# managed release.yml calls this workflow whenever release-please creates
# or refreshes the release PR (independently of any release cut), so
# everything this repository wants on that PR happens here. Add jobs
# freely - releases never wait on this path. Until the managed caller
# lands via template sync, this file has no trigger: workflow_call only,
# dormant and harmless.
#
# Today's one job keeps the release PR annotated with a sticky comment
# listing every live migration and when its dead-man switch (the
# MIGRATION_EXPIRIES registry) fires. The caller runs on push to main, so
# the default checkout below is the main tip: the table renders main's
# registry, which is what the release ships. The caller's provenance (the
# release PR's own number and head branch) replaces the old
# pull_request-triggered workflow's same-repo and branch-prefix guards,
# and the pipeline's single writer replaces its per-PR concurrency queue.

name: Update Release PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  migration-expiry-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Commenting on a PR through the issues endpoints needs pull-requests write.
      pull-requests: write
    steps:
      # Default ref on purpose: main's registry, not the PR head - the
      # inputs.head_branch provenance is unused here because the expiry
      # table describes what the release will ship, not the PR's diff.
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # No dependency install: the script's whole runtime graph is repo-local
      # TypeScript with zero package imports (the registry is a zero-import
      # leaf). --no-install enforces that here - without it bun would silently
      # auto-install a package import when node_modules is absent - and the
      # bun smoke test runs the executable the same bare way.
      - name: Render the migration-expiry table
        run: bun --no-install scripts/ci/migration-expiry-table.ts > "$RUNNER_TEMP/migration-expiries.md"

      - name: Post or update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # The marker is the renderer's first output line
          # (MIGRATION_EXPIRY_MARKER in scripts/ci/migration-expiry-render.ts;
          # a bun test pins the two literals together). Matching it on this
          # workflow's own bot comments only - anyone with write access could
          # PATCH another user's comment, and a user-posted marker must not
          # draw an edit - keeps the update idempotent: one comment, edited in
          # place, stray duplicates healed by deletion.
          ids="$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- migration-expiries -->")) | .id')"
          first=""
          extras=()
          while IFS= read -r id; do
            if [ -z "$id" ]; then
              continue
            fi
            if [ -z "$first" ]; then
              first="$id"
            else
              extras+=("$id")
            fi
          done <<< "$ids"
          # The primary update runs before duplicate healing so a DELETE
          # hiccup (a 404 from a comment another run already removed) can
          # never block the table refresh itself.
          if [ -n "$first" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$first" \
              -F "body=@$RUNNER_TEMP/migration-expiries.md" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              -F "body=@$RUNNER_TEMP/migration-expiries.md" > /dev/null
          fi
          for id in "${extras[@]}"; do
            echo "deleting duplicate sticky comment $id"
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$id" > /dev/null \
              || echo "::warning::could not delete duplicate sticky comment $id"
          done
