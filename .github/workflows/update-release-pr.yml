# The release-PR hook of the release pipeline: repo-owned, generated once
# by Vivswan/repo-platform and never overwritten by sync. The managed
# ci.yml calls this workflow whenever release-please creates or refreshes
# the release PR (independently of any release cut), so everything this
# repository wants on that PR happens here. Add jobs freely - releases
# never wait on this path. workflow_call is its only trigger.
#
# Today's one job keeps the release PR annotated with a sticky comment
# listing every live migration and when its dead-man switch (the
# MIGRATION_EXPIRIES registry) fires. The caller runs on push to main, so
# the default checkout below is the main tip: the table renders main's
# registry, which is what the release ships. The caller's provenance (the
# release PR's own number and head branch) replaces the old
# pull_request-triggered workflow's same-repo and branch-prefix guards,
# and the pipeline's single writer replaces its per-PR concurrency queue.

name: Update Release PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  migration-expiry-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The sticky-comment action posts, edits, and deletes its PR comment.
      pull-requests: write
    steps:
      # Default ref on purpose: main's registry, not the PR head - the
      # inputs.head_branch provenance is unused here because the expiry
      # table describes what the release will ship, not the PR's diff.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # No dependency install: the script's whole runtime graph is repo-local
      # TypeScript with zero package imports (the registry is a zero-import
      # leaf). --no-install enforces that here - without it bun would silently
      # auto-install a package import when node_modules is absent - and the
      # bun smoke test runs the executable the same bare way.
      - name: Render the migration-expiry table
        id: render
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # The sticky-comment action reads a missing or unparseable PR number
          # as nothing to do and exits green; refuse one before it can.
          case "$PR_NUMBER" in
            ''|0*|*[!0-9]*)
              echo "::error::pr_number must be a positive integer, got '$PR_NUMBER'"
              exit 1
              ;;
          esac
          bun --no-install scripts/ci/migration-expiry-table.ts > "$RUNNER_TEMP/migration-expiries.md"
          # An empty rendering means no migration is live: the step below
          # then deletes the comment instead of posting an empty table.
          if [ -s "$RUNNER_TEMP/migration-expiries.md" ]; then
            echo "empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "empty=true" >> "$GITHUB_OUTPUT"
          fi

      # The action finds its earlier comment by the header (its own hidden
      # marker) among the token identity's comments, edits it in place, and
      # deletes it when the registry has drained. The caller runs on push, so
      # the event payload names no pull request: number carries the release
      # PR's.
      - name: Post, update, or delete the sticky comment
        id: sticky
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: migration-expiries
          number: ${{ inputs.pr_number }}
          path: ${{ runner.temp }}/migration-expiries.md
          delete: ${{ steps.render.outputs.empty }}

      # A live table that reached no comment is the one silent outcome the
      # action can still produce (it skips instead of failing when its lookup
      # has nothing to work on); it fails here instead.
      - name: Fail if a live table reached no comment
        if: steps.render.outputs.empty == 'false' && steps.sticky.outputs.previous_comment_id == '' && steps.sticky.outputs.created_comment_id == ''
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "::error::the sticky-comment action neither found nor created a comment on PR $PR_NUMBER"
          exit 1
