name: Test (Reusable)

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run on (ubuntu-latest, windows-latest, macos-latest, or "matrix" for all)'
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run (unit or docker)'
        required: false
        type: string
        default: 'unit'
      docker-only:
        description: 'Comma-separated docker-test labels to run (docker suite on Linux only; empty runs the full set)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to run on (ubuntu-latest, windows-latest, macos-latest, or "matrix" for all)'
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run (unit or docker)'
        required: false
        type: string
        default: 'unit'
      docker-only:
        description: 'Comma-separated docker-test labels to run (docker suite on Linux only; empty runs the full set)'
        required: false
        type: string
        default: ''

jobs:
  test:
    permissions:
      contents: read
    # Roughly double the slowest observed leg (the Windows unit pass at about
    # fifteen minutes; the docker-stack shards routed through this job finish
    # well under that); without a pin a hung host runs into GitHub's
    # 360-minute default, and fail-fast is off so no sibling leg would cut it
    # short.
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the other legs: the all-green gate
      # aggregates at the end either way, and a cancelled leg destroys the
      # signal of whether it would have passed.
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'matrix' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}

    steps:
      # The run steps below map only the exact value 'docker' to the docker
      # suite, so a typo'd suite would otherwise silently run the unit suite.
      # docker-only likewise only reaches the Linux docker run step, so any
      # other combination must fail here rather than silently run everything.
      - name: Validate the suite input
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          DOCKER_ONLY: ${{ inputs.docker-only }}
        run: |
          if [ "$SUITE" != "unit" ] && [ "$SUITE" != "docker" ]; then
            echo "::error::Unknown suite '$SUITE'; expected 'unit' or 'docker'."
            exit 1
          fi
          if [ -n "$DOCKER_ONLY" ] && { [ "$SUITE" != "docker" ] || [ "$RUNNER_OS" != "Linux" ]; }; then
            echo "::error::docker-only is set but this is the '$SUITE' suite on $RUNNER_OS; it applies only to the docker suite on Linux."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history: the crediting-convention guard in the unit suite
          # (src/test/creditConvention.test.ts) walks git log back to the
          # commit that introduced ACKNOWLEDGMENTS.md.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun run setup-env:pwsh

      - name: Set up development environment (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/env/setup-env.sh

      - name: Lint
        run: bun run lint

      - name: Compile
        run: bun run compile

      # Linux also collects coverage and enforces the line-coverage floor;
      # one coverage-enforcing OS keeps CI time in check. A non-empty
      # docker-only narrows the docker orchestrator to the listed labels
      # (the validation step has already pinned it to this suite and OS).
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DOCKER_ONLY: ${{ inputs.docker-only }}
        run: |
          if [ -n "$DOCKER_ONLY" ]; then
            xvfb-run -a bun run test:docker --only "$DOCKER_ONLY"
          else
            xvfb-run -a bun run ${{ inputs.suite == 'docker' && 'test:docker' || 'test:coverage' }}
          fi

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: bun run ${{ inputs.suite == 'docker' && 'test:docker' || 'test' }}
