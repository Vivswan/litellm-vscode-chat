name: Test (Reusable)

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run on (ubuntu-latest, windows-latest, macos-latest, or "matrix" for all)'
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run (unit or docker)'
        required: false
        type: string
        default: 'unit'
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to run on (ubuntu-latest, windows-latest, macos-latest, or "matrix" for all)'
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run (unit or docker)'
        required: false
        type: string
        default: 'unit'

jobs:
  test:
    permissions:
      contents: read
    strategy:
      matrix:
        os: ${{ inputs.os == 'matrix' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}

    steps:
      # The run steps below map only the exact value 'docker' to the docker
      # suite, so a typo'd suite would otherwise silently run the unit suite.
      - name: Validate the suite input
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if [ "$SUITE" != "unit" ] && [ "$SUITE" != "docker" ]; then
            echo "::error::Unknown suite '$SUITE'; expected 'unit' or 'docker'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun run setup-env:pwsh

      - name: Set up development environment (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/setup-env.sh

      - name: Lint
        run: bun run lint

      - name: Compile
        run: bun run compile

      # Linux also collects coverage and enforces the line-coverage floor;
      # one coverage-enforcing OS keeps CI time in check.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run ${{ inputs.suite == 'docker' && 'test:docker' || 'test:coverage' }}

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        run: bun run ${{ inputs.suite == 'docker' && 'test:docker' || 'test' }}
