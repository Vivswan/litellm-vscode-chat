name: Test (Reusable)

on:
  workflow_call:
    inputs:
      os:
        description: 'Operating system to run on (ubuntu-latest, windows-latest, macos-latest, or "matrix" for all)'
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run (unit or docker)'
        required: false
        type: string
        default: 'unit'
      docker-only:
        description: 'Comma-separated docker-test labels to run (docker suite on Linux only; empty runs the full set)'
        required: false
        type: string
        default: ''
      vscode-version:
        description: 'VS Code build to run the host suites on (stable, insiders, or a version; empty is the current stable)'
        required: false
        type: string
        default: ''
      litellm-image:
        description: 'LiteLLM image reference for the docker suite (empty runs the version docker-compose.yml pins)'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      os:
        description: 'Operating system to run on (ubuntu-latest, windows-latest, macos-latest, or "matrix" for all)'
        required: false
        type: string
        default: 'ubuntu-latest'
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      suite:
        description: 'Test suite to run (unit or docker)'
        required: false
        type: string
        default: 'unit'
      docker-only:
        description: 'Comma-separated docker-test labels to run (docker suite on Linux only; empty runs the full set)'
        required: false
        type: string
        default: ''
      vscode-version:
        description: 'VS Code build to run the host suites on (stable, insiders, or a version; empty is the current stable)'
        required: false
        type: string
        default: ''
      litellm-image:
        description: 'LiteLLM image reference for the docker suite (empty runs the version docker-compose.yml pins)'
        required: false
        type: string
        default: ''

jobs:
  test:
    permissions:
      contents: read
    # Roughly double the slowest observed leg (the Windows unit pass at about
    # fifteen minutes; the docker-stack shards routed through this job finish
    # well under that); without a pin a hung host runs into GitHub's
    # 360-minute default, and fail-fast is off so no sibling leg would cut it
    # short.
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the other legs: the all-green gate
      # aggregates at the end either way, and a cancelled leg destroys the
      # signal of whether it would have passed.
      fail-fast: false
      matrix:
        os: ${{ inputs.os == 'matrix' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON(format('["{0}"]', inputs.os)) }}
    runs-on: ${{ matrix.os }}

    steps:
      # The run steps below map only the exact value 'docker' to the docker
      # suite, so a typo'd suite would otherwise silently run the unit suite.
      # docker-only and litellm-image likewise only reach the docker suite, so
      # any other combination must fail here rather than silently run the
      # pinned stack or everything.
      - name: Validate the suite input
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
          DOCKER_ONLY: ${{ inputs.docker-only }}
          LITELLM_IMAGE: ${{ inputs.litellm-image }}
        run: |
          if [ "$SUITE" != "unit" ] && [ "$SUITE" != "docker" ]; then
            echo "::error::Unknown suite '$SUITE'; expected 'unit' or 'docker'."
            exit 1
          fi
          if [ -n "$DOCKER_ONLY" ] && { [ "$SUITE" != "docker" ] || [ "$RUNNER_OS" != "Linux" ]; }; then
            echo "::error::docker-only is set but this is the '$SUITE' suite on $RUNNER_OS; it applies only to the docker suite on Linux."
            exit 1
          fi
          if [ -n "$LITELLM_IMAGE" ] && [ "$SUITE" != "docker" ]; then
            echo "::error::litellm-image is set but this is the '$SUITE' suite; it applies only to the docker suite."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Full history: the crediting-convention guard in the unit suite
          # (src/test/creditConvention.test.ts) walks git log back to the
          # commit that introduced ACKNOWLEDGMENTS.md.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up development environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun run setup-env:pwsh

      - name: Set up development environment (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/env/setup-env.sh

      - name: Lint
        run: bun run lint

      - name: Compile
        run: bun run compile

      # The host suite asks update.code.visualstudio.com for the current build on every job, and that lookup has died
      # with ETIMEDOUT before a single test ran. The weekly key follows the current build; the prefix restore keeps
      # last week's as the fallback @vscode/test-electron reads when the lookup fails (its newest vscode-<platform>-*).
      #   lookup ok, build cached   -> no download
      #   lookup ok, build missing  -> download; saved only when this week's key was a miss
      #   lookup times out          -> a warning, the newest cached build runs
      - name: Stamp the week
        id: vscode-week
        shell: bash
        run: echo "stamp=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the VS Code build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ inputs.vscode-version || 'stable' }}-${{ steps.vscode-week.outputs.stamp }}
          restore-keys: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ inputs.vscode-version || 'stable' }}-

      # A prefix restore would otherwise carry every build ever cached; the fallback only ever reads the newest.
      - name: Keep only the newest cached build
        shell: bash
        run: |
          shopt -s nullglob
          printf '%s\n' .vscode-test/vscode-*/ | sort -V | sed '$d' | while read -r dir; do rm -rf "$dir"; done

      # Linux also collects coverage and enforces the line-coverage floor;
      # one coverage-enforcing OS keeps CI time in check. A non-empty
      # docker-only narrows the docker orchestrator to the listed labels
      # (the validation step has already pinned it to this suite and OS).
      # VSCODE_TEST_VERSION is read by .vscode-test.mjs, LITELLM_IMAGE by
      # docker-compose.yml; both empty means the gate's defaults, the current
      # stable VS Code and the pinned image.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DOCKER_ONLY: ${{ inputs.docker-only }}
          VSCODE_TEST_VERSION: ${{ inputs.vscode-version }}
          LITELLM_IMAGE: ${{ inputs.litellm-image }}
          SUITE_SCRIPT: ${{ inputs.suite == 'docker' && 'test:docker' || 'test:coverage' }}
        run: |
          if [ -n "$DOCKER_ONLY" ]; then
            xvfb-run -a bun run test:docker --only "$DOCKER_ONLY"
          else
            xvfb-run -a bun run "$SUITE_SCRIPT"
          fi

      - name: Run tests (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          VSCODE_TEST_VERSION: ${{ inputs.vscode-version }}
          LITELLM_IMAGE: ${{ inputs.litellm-image }}
          SUITE_SCRIPT: ${{ inputs.suite == 'docker' && 'test:docker' || 'test' }}
        run: bun run "$SUITE_SCRIPT"
