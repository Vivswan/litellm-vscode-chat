# This file is managed by Vivswan/repo-platform.
# Local edits are replaced on the next sync.
name: Auto Assign

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue or PR number to assign (leave empty to sweep every open unassigned item)
        required: false
        default: ""
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  # Nightly sweep: every open unassigned issue and PR, whether created with a workflow token (no open event fired)
  # or opened by Dependabot or from a fork (an open event fired, but with a token the job cannot write with).
  schedule:
    - cron: "13 6 * * *"

permissions: {}

jobs:
  auto-assign:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Vivswan/repo-platform/.github/workflows/reusable-auto-assign.yml@stable
    with:
      issue: ${{ inputs.issue || '' }}
