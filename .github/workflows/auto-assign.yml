# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
name: Auto Assign

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue or PR number to assign (leave empty to sweep every open unassigned item)
        required: false
        default: ""
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]
  # Nightly catch-up sweep: assigns everything open and unassigned whose
  # creation fired no workflow - issues, PRs, and (on CodeQL repos) code
  # scanning alerts.
  schedule:
    - cron: "13 6 * * *"
  # Code scanning alerts have no creation trigger for Actions, so also
  # assign them after each CI run completes.
  workflow_run:
    workflows: ["CI"]
    types: [completed]

# No workflow-level grants: each job grants its reusable workflow exactly
# what it needs (contents:read is CODEOWNERS resolution).
permissions: {}

jobs:
  auto-assign:
    if: github.event_name == 'issues' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Vivswan/repo-platform/.github/workflows/reusable-auto-assign.yml@build
    with:
      issue: ${{ inputs.issue || '' }}
  # Separate job so security-events stays off the job above (a reusable
  # call is statically validated against every job, `if:` or not). A
  # dispatch naming an issue is a targeted assignment, not an alert sweep.
  assign-alerts:
    if: github.event_name == 'workflow_run' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.issue == '')
    permissions:
      contents: read
      security-events: write
    uses: Vivswan/repo-platform/.github/workflows/reusable-auto-assign-alerts.yml@build
