# This file is managed by Vivswan/repo-platform.
# Local edits are replaced on the next sync.
#
# Judges the pull request title, as the `pr-title` check the module's settings layer makes a required status check.
#
# A required check must run on every event that changes what it judges, so the workflow runs on the title's events
# (opened, edited, reopened).
#
# It runs on synchronize too, because a required check must exist at the PR's newest head commit, so a push without
# a fresh run would leave the merge box waiting on a check nothing creates.

name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# The title arrives in the event payload; the job reads nothing else.
permissions: {}

jobs:
  # PRs are squash-merged, so the PR title becomes the commit subject and
  # drives release-please versioning. The job id is the check-run name the
  # ruleset requires.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The judge the commit-names gate runs on commit subjects, so no title passes here and lands red there.
      - uses: Vivswan/repo-platform/actions/validate-commit-names@stable
        with:
          title: ${{ github.event.pull_request.title }}
