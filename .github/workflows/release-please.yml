# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# The release-please machinery: cuts releases by accumulating conventional
# commits on main into a release PR. GitHub releases are immutable once
# published (the tag and assets freeze, a late upload gets HTTP 422), so
# the generated release-please-config.json sets `draft` +
# `force-tag-creation`: merging the release PR creates a DRAFT release with
# its tag already forced at the merge SHA, and the repo-owned release.yml
# pipeline updates the draft (asset uploads, note edits) and publishes it
# as its last job - always the same three steps, never direct publishing.
# Config and pipeline are both repo-owned, so a repo
# generated before the draft flow keeps publishing directly. Called from
# release.yml downstream of the all-green gate, so releases and release-PR
# refreshes only happen on a green main.
#
# Without the REPO_PLATFORM_TOKEN secret the release PR is created by the
# default GITHUB_TOKEN and needs a close/reopen to run its checks.

name: Release Please

on:
  workflow_call:
    outputs:
      release_created:
        description: "'true' when this run just cut a release"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: The tag of the release that was just cut (a draft-flow config forces the tag at creation, so it is checkout-able before publication)
        value: ${{ jobs.release-please.outputs.tag_name }}

# The effective token comes from the calling job; declaring the needs here
# documents them and caps a caller that grants more. The read keys feed the
# release-health pre-flight (open issues, Dependabot alerts).
permissions:
  contents: write
  pull-requests: write
  issues: read
  vulnerability-alerts: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A green run releases only the head it tested: if main moved on, skip
      # and let the newer push's own run release (after its CI passes).
      # gh api (not anonymous ls-remote) so private repositories work too.
      - name: Check this run tested the current head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to ${head:0:7} since this run started; the newer run releases"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # Authoritative release gating: the release PR's release-health CI job
      # gives early visible feedback, but it can be stale by merge time (a
      # tracking or blocker issue opened after that PR went green re-runs no
      # check), so the same action runs again here before release-please
      # acts. In release mode the gate self-scopes to release-cut pushes:
      # it gates only a push that merges a release-please-- PR (reading the
      # release-override label from that PR) and passes trivially on every
      # other run, so ordinary main pushes and release-PR refreshes are
      # never blocked.
      - uses: Vivswan/repo-platform/actions/release-health@main
        if: steps.head.outputs.current == 'true'
        with:
          mode: release
          tracking-labels: "nightly-fuzz,nightly-failure"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: googleapis/release-please-action@v5
        id: release
        if: steps.head.outputs.current == 'true'
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
