# This file is managed by Vivswan/repo-platform.
# Local edits are replaced on the next sync.
#
# The same file in every repository: fleet-ci.yml@build's plan job reads
# .repo-platform.yml and outputs the module selection, so the legs after
# the gate are static jobs that each gate themselves on that output; an
# edit there changes this repository's CI with no PR here. Branch
# protection requires the `all-green` job's own check run: it needs every
# gating job and fails unless each result is success or skipped, with at
# least one success.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: the scheduled run carries the fleet's scheduled scans, and
    # CodeQL keeps its weekly rescan through fleet-ci's plan output.
    - cron: "3 4 * * *"

permissions:
  contents: read

# Keyed by the commit on a push: every merge to main gets its own complete run and verdict.
# A ref-keyed group keeps one pending run and cancels the older one, so a burst of merges leaves the tip unjudged.
# Pull-request runs stay keyed by the ref: a newer push cancels the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Repo-owned: edit checks.yml, not this file (no secrets; permissions
  # cap at contents: read). The nightly run is the fleet callers' alone.
  checks:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/checks.yml

  # This caller's permissions are the ceiling for every called job and
  # must stay UNCONDITIONAL: GitHub validates skipped jobs' grants too.
  ci:
    uses: Vivswan/repo-platform/.github/workflows/fleet-ci.yml@build
    permissions:
      contents: read
      # validate-managed-files posts its sticky findings comment.
      pull-requests: write
      # The ceiling for the CodeQL analysis calls.
      security-events: write
      actions: read
      # The ceiling for release-health's issue reads; no called job here
      # writes issues (the nightly caller below carries that grant).
      issues: read
      # The ceiling for release-health's Dependabot-alert reads.
      vulnerability-alerts: read

  # The nightly security scan, behind its own caller because it files the
  # tracking issue: `issues: write` exceeds the `ci` ceiling, and GitHub
  # checks a called job's grant before its condition. Not a gate: it is
  # not in all-green's needs and stays green whatever it finds.
  nightly:
    if: github.event_name == 'schedule'
    uses: Vivswan/repo-platform/.github/workflows/fleet-nightly.yml@build
    permissions:
      contents: read
      issues: write
      security-events: write

  # THE gate: this job's own check run (named all-green, created by the
  # GitHub Actions app) is the ruleset's required check. It needs both
  # caller jobs and fails unless each result is success or skipped, with
  # at least one success - so a failed job anywhere in either called
  # workflow blocks the merge.
  all-green:
    needs: [checks, ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Vivswan/repo-platform/actions/all-green@build
        with:
          needs: ${{ toJSON(needs) }}

  # Repo-owned: edit post-green.yml, not this file. Runs after the gate,
  # before the release, on the judged commit; no job lane here (a caller
  # holding a lane a called job takes deadlocks the call).
  post-green:
    needs: [all-green]
    if: >-
      needs.all-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      # contents write lets the hook push a fast-forward branch (a packaged latest).
      # id-token write lets it mint the run's OIDC token for trusted publishing (npm, PyPI).
      # A called job cannot exceed its caller, so both scopes are granted here.
      contents: write
      id-token: write
    uses: ./.github/workflows/post-green.yml
    with:
      sha: ${{ github.sha }}
    # The called workflow is this repository's own, so it inherits the repository's secrets by design.
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # The legs below exist in every repository and gate themselves on the
  # plan's modules output: a substring test on the compact JSON array,
  # hence the quoted module name. `ci` sits in each needs list because a
  # job reads outputs only from its direct dependencies. The release runs
  # downstream of the gate AND the repo-owned hook, so the repository's own
  # green-gated work lands before the tag is minted.
  # No lane here: a shared lane keeps one pending call and cancels the older one,
  # so a release commit's call could be cancelled.
  # The called job holds its own lane keyed by the judged commit, so only a re-run of the same commit ever waits.
  release:
    needs: [ci, all-green, post-green]
    if: >-
      needs.all-green.result == 'success' &&
      needs.post-green.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.ci.outputs.modules, '"release-please"')
    permissions:
      contents: write
      pull-requests: write
      issues: read
      vulnerability-alerts: read
    uses: Vivswan/repo-platform/.github/workflows/fleet-release.yml@build
    with:
      sha: ${{ github.sha }}
      tracking-labels: ${{ needs.ci.outputs.tracking-labels }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # Repo-owned: edit update-release.yml, not this file. Packaging, asset
  # uploads, and note edits for the draft; publishing waits for every job
  # in it. The ceiling here and on update-release-pr is the contract with
  # the repo-owned hooks: a hook may need up to these grants and narrows
  # itself per job. A narrower caller ceiling rejects an existing hook
  # that asks for more (a hook requesting packages: read failed against
  # a ceiling without it).
  update-release:
    needs: [release]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      issues: read
      vulnerability-alerts: read
    uses: ./.github/workflows/update-release.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    # The called workflow is this repository's own, so it inherits the repository's secrets by design.
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # Attests every asset the hook uploaded and flips the draft live.
  publish-release:
    needs: [release, update-release]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Vivswan/repo-platform/.github/workflows/fleet-release-publish.yml@build
    with:
      tag: ${{ needs.release.outputs.tag_name }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}

  # Repo-owned: edit update-release-pr.yml, not this file. Regenerates the
  # files that ride in the release commit; independent of the publish. The
  # ceiling is update-release's, under the same contract.
  update-release-pr:
    needs: [release]
    if: needs.release.outputs.prs_created == 'true'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
      attestations: write
      issues: read
      vulnerability-alerts: read
    uses: ./.github/workflows/update-release-pr.yml
    with:
      pr_number: ${{ needs.release.outputs.pr_number }}
      head_branch: ${{ needs.release.outputs.pr_head_branch }}
    # The called workflow is this repository's own, so it inherits the repository's secrets by design.
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # The Pages deploy, in the SAME run as the gate (github.sha IS the judged
  # commit): a red main never reaches the site. Ordered behind the hook and
  # the publish so a release commit's own deploy serves its new tag;
  # !cancelled() keeps those edges orders, not gates: a skipped or red
  # release still deploys. No push clause: the leg runs on every main run,
  # so the nightly schedule IS the rebuild and a dispatch IS the manual
  # deploy. The called workflow runs the repo-owned site-build hook from
  # the checkout and reads the docs configuration from the registration.
  site:
    needs: [ci, all-green, post-green, publish-release]
    if: >-
      !cancelled() &&
      needs.all-green.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(needs.ci.outputs.modules, '"site"')
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    uses: Vivswan/repo-platform/.github/workflows/reusable-site.yml@build
    with:
      sha: ${{ github.sha }}
      custom_domain: ${{ vars.CUSTOM_DOMAIN }}
