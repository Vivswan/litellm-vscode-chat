# Manual host-fidelity runs. The suite was promoted into checks.yml (inside
# the all-green gate) after its burn-in streak on main; this workflow stays
# for on-demand dispatch only, so pushes and PRs do not run it twice.

name: Host Fidelity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-fidelity:
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'ubuntu-latest'
      suite: 'host-fidelity'
