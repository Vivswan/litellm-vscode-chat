# Repo-owned (not managed by the fleet sync): auto-closes answered issues.
# Label an issue `awaiting-reply` after answering it; if nothing on the issue
# changes for three days, this closes it with a pointer to reopen. Any
# activity (a comment, an edit, a label change) resets the clock. Closed
# issues are skipped entirely; reopening one counts as activity, so the next
# run strips both labels instead of re-closing it.
#
# A non-maintainer reply hands an open issue back and clears both labels at
# once, so the sweep never closes an issue where the reporter spoke last.
# Bot comments (this workflow's own close message) and comments on closed
# issues leave the labels alone, or the reopen cleanup above finds nothing.
name: Close Answered Issues

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  handed-back:
    if: >-
      github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'awaiting-reply')
      && github.event.comment.user.type != 'Bot'
      && !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label awaiting-reply,auto-closed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}

  close:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # The action persists its operations state through the Actions cache.
      actions: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-issue-labels: awaiting-reply
          days-before-issue-stale: 3
          # Close in the same run the issue goes stale: the three quiet days
          # are the whole grace period, with no separate warning phase.
          days-before-issue-close: 0
          close-issue-reason: completed
          stale-issue-label: auto-closed
          close-issue-message: >
            Closing since there was no further reply. If the answer above did
            not resolve it, comment here and the issue can be reopened.
          labels-to-remove-when-unstale: awaiting-reply
          # Issues only; pull requests are never touched. The unstale override
          # keeps even a hand-labeled stale PR out of reach.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-pr-stale-when-updated: false
