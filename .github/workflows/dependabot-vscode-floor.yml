# Repo-owned. Dependabot bumps @types/vscode but cannot move engines.vscode
# with it, so those PRs land red on the check-vscode-types gate (typings
# newer than the floor are rejected). This raises the floor and every doc
# stating it on Dependabot's own PRs; a bump the floor already covers is a
# no-op. Token contract: register REPO_PLATFORM_TOKEN as a Dependabot
# secret so the fix commit re-runs CI (github.token starts no workflows).

name: Dependabot VS Code Floor

on:
  pull_request:
    paths: ["package.json"]

permissions:
  contents: read

# Dependabot force-pushes on rebase, so only the newest run per PR and
# actor proceeds; the actor keeps the fix push's own run from cancelling
# the finishing original.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  raise-floor:
    # Dependabot's own pushes only, same-repo only (the token cannot push
    # to a fork). github.actor on purpose: gating on the PR author instead
    # would re-fire on the fix commit this job pushes.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository # zizmor: ignore[bot-conditions]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write # the no-retrigger-token sticky comment below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The event's own commit, not the mutable branch: the actor gate
          # authenticates the event, and a branch moved after it must not
          # choose the code that runs beside the write token. A stale sha
          # just loses the push race below and fails loudly.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Raise engines.vscode and the doc floors to the @types/vscode pin
        run: bun scripts/ci/sync-vscode-floor.ts
      - name: Commit and push the floor bump
        id: push
        env:
          TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          CAN_RETRIGGER: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bun scripts/ci/push-floor-bump.ts
      # One comment per PR, edited in place on every fix push; a posting
      # failure fails the step.
      - name: Say the fix push cannot re-trigger CI
        if: steps.push.outputs.no_retrigger == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: dependabot-vscode-floor
          message: >-
            Pushed an engines.vscode floor bump with the default workflow token, which starts no workflows,
            so checks will not re-run on the new head. Close and reopen this PR to re-run them, or register
            `REPO_PLATFORM_TOKEN` as a Dependabot secret so future fixes re-trigger CI automatically.
