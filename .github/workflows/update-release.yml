# The update stage of the release pipeline: repo-owned, generated once by
# Vivswan/repo-platform and never overwritten by template
# sync. The managed release.yml calls this workflow between cutting the
# draft release and the attested publish, so everything this repository
# wants on the release happens here: packaging, asset uploads, note edits.
# Add jobs freely - publishing waits for every job in this file, and every
# asset uploaded here is attested at publish time into the release's
# single attestation.json. Recovery when a run dies mid-pipeline is
# documented in release.yml.

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (forced at creation, so it is checkout-able before publication)
        required: true
        type: string

jobs:
  # Package the released tag and publish it: VSIX to the VS Code
  # Marketplace (MARKETPLACE_TOKEN is an Azure DevOps PAT, reaching this
  # workflow through the managed caller's `secrets: inherit`) and as a
  # draft release asset. vscode:prepublish runs the production typecheck,
  # the Rolldown bundle, and the ThirdPartyNotices generation. If a step
  # fails after the Marketplace publish, the release stays an invisible
  # draft; finish by hand as release.yml's header describes. This job no
  # longer attests the VSIX itself: the managed publish-release attests
  # every uploaded asset centrally into the release's attestation.json.
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # also what makes the draft visible to gh
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Type-check and bundle the extension
        run: bun run vscode:prepublish

      - name: Package VSIX
        run: bunx vsce package -o extension.vsix

      - name: Publish to VS Code Marketplace
        run: bunx vsce publish --pat "$MARKETPLACE_TOKEN" --packagePath ./extension.vsix
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}

      - name: Attach VSIX to the draft release
        run: gh release upload "$RELEASE_TAG" extension.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
