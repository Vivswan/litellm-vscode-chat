# The update stage of the release pipeline: repo-owned, generated once by
# the fleet sync and never overwritten by it. The managed ci.yml
# calls this workflow between the fleet's release leg cutting the draft
# release and its attested publish, so everything this repository wants
# on the release happens here: packaging, asset uploads, note edits. Add
# jobs freely - publishing waits for every job in this file, and every
# asset uploaded here is attested at publish time into the release's
# single attestation.json. Recovery when a run dies mid-pipeline is
# documented in the header of the fleet's release workflow (fleet-release.yml).

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (forced at creation, so it is checkout-able before publication)
        required: true
        type: string

jobs:
  # The Marketplace publish stores no token. vsce trades the job's OIDC
  # token for a 15-minute credential, granted by a Trusted Publishing
  # policy on the publisher (marketplace.visualstudio.com/manage). The
  # policy names this repository and a workflow file, so renaming this
  # file or its caller needs the policy changed with it.
  #
  # If a step fails after the Marketplace publish, the release stays an
  # invisible draft. Finish by hand as fleet-release.yml's header
  # describes.
  #
  # The VSIX is not attested here: the fleet's publish leg attests every
  # uploaded asset into the release's attestation.json.
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # also what makes the draft visible to gh
      id-token: write # the OIDC token vsce trades for the Marketplace credential
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up development environment
        run: bun scripts/env/setup-env.ts

      - name: Type-check and bundle the extension
        run: bun run vscode:prepublish

      - name: Package VSIX
        run: bunx vsce package -o extension.vsix

      - name: Publish to VS Code Marketplace
        run: bunx vsce publish --oidc --packagePath ./extension.vsix

      - name: Attach VSIX to the draft release
        run: gh release upload "$RELEASE_TAG" extension.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
