# Repo-owned release pipeline, called by the managed ci.yml on top of the
# all-green gate. Generated once by Vivswan/repo-platform and
# never overwritten by template sync: by default it just runs the managed
# release-please machinery, and this file is where jobs BEFORE the release
# (make release-please `needs:` them) and AFTER it (gated on its outputs,
# e.g. packaging and publishing) go. Everything runs in the same workflow
# run, so it works with the default GITHUB_TOKEN too, which cannot trigger
# `on: release` workflows.

name: Release

on:
  workflow_call:

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    secrets: inherit

  # Package the released tag and publish it: VSIX to the VS Code
  # Marketplace (MARKETPLACE_TOKEN is an Azure DevOps PAT) and as a release
  # asset. vscode:prepublish runs the production typecheck, the esbuild
  # bundle, and the ThirdPartyNotices generation.
  #
  # GitHub releases are immutable once published: assets freeze at
  # publication, so a post-publication `gh release upload` gets a 422 (this
  # killed the v0.4.1 asset). release-please therefore creates the release
  # as a DRAFT ("draft": true in release-please-config.json, with
  # "force-tag-creation": true so the tag exists for the checkout below and
  # for release-please's own changelog bookkeeping); this job attaches the
  # VSIX while the draft is still mutable and publishes the release as its
  # last step. If a step fails after the Marketplace publish, the release
  # stays an invisible draft; finish by hand with
  #   gh release upload <tag> extension.vsix --clobber
  #   gh release edit <tag> --draft=false
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Type-check and bundle the extension
        run: bun run vscode:prepublish

      - name: Package VSIX
        run: bunx vsce package -o extension.vsix

      - name: Publish to VS Code Marketplace
        run: bunx vsce publish --pat "$MARKETPLACE_TOKEN" --packagePath ./extension.vsix
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}

      - name: Attach VSIX to the draft release
        run: gh release upload "$RELEASE_TAG" extension.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

      # Publishing freezes the release (immutable releases), so this must
      # stay the last step, after the VSIX is attached.
      - name: Publish the GitHub release
        run: gh release edit "$RELEASE_TAG" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
