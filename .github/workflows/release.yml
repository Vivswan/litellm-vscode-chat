# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# The release pipeline, called by the managed ci.yml on top of the
# all-green gate, so releases and release-PR refreshes only happen on a
# green main. release-please accumulates conventional commits on main into
# a release PR; merging it cuts the release. GitHub releases are immutable
# once published (the tag and assets freeze, a late upload gets HTTP 422),
# so every release moves through the same three stages, always draft-first:
#   1. release-please cuts the release as a DRAFT with its tag already
#      forced at the merge SHA (`draft` + `force-tag-creation` in the
#      repo-owned release-please-config.json).
#   2. update-release calls the repo-owned update-release.yml with the
#      tag: this repository's packaging, asset uploads, and note edits go
#      there (add jobs to that file freely - publishing waits for all of
#      them).
#   3. publish-release attests build provenance for every asset on the
#      draft - one Sigstore bundle attached as a single attestation.jsonl,
#      one JSONL line per asset - and flips the draft live:
#      `gh attestation verify <asset> -R <owner>/<repo> --bundle attestation.jsonl`
#      The bundle rides on the frozen release itself, so verification
#      never depends on GitHub's attestations API staying reachable.
# Everything runs in the same workflow run, so it works with the default
# GITHUB_TOKEN too, which cannot trigger `on: release` workflows. Without
# the REPO_PLATFORM_TOKEN secret the release PR is created by the default
# GITHUB_TOKEN and needs a close/reopen to run its checks.
# If the pipeline dies after the draft exists, a rerun cannot recreate it
# (release-please sees the forced tag); re-run this run's failed jobs, or
# finish by hand (a hand-published release carries no attestation.jsonl):
#   gh release upload <tag> <assets> --clobber
#   gh release edit <tag> --draft=false

name: Release

on:
  workflow_call:

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The effective token comes from the calling job's ceiling; declaring
    # the needs here documents them and caps a caller that grants more.
    # The read keys feed the release-health pre-flight (open issues,
    # Dependabot alerts).
    permissions:
      contents: write
      pull-requests: write
      issues: read
      vulnerability-alerts: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A green run releases only the head it tested: if main moved on, skip
      # and let the newer push's own run release (after its CI passes).
      # gh api (not anonymous ls-remote) so private repositories work too.
      - name: Check this run tested the current head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main moved to ${head:0:7} since this run started; the newer run releases"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      # Authoritative release gating: the release PR's release-health CI job
      # gives early visible feedback, but it can be stale by merge time (a
      # tracking or blocker issue opened after that PR went green re-runs no
      # check), so the same action runs again here before release-please
      # acts. In release mode the gate self-scopes to release-cut pushes:
      # it gates only a push that merges a release-please-- PR (reading the
      # release-override label from that PR) and passes trivially on every
      # other run, so ordinary main pushes and release-PR refreshes are
      # never blocked.
      - uses: Vivswan/repo-platform/actions/release-health@main
        if: steps.head.outputs.current == 'true'
        with:
          mode: release
          tracking-labels: "nightly-fuzz,nightly-failure"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: googleapis/release-please-action@v5
        id: release
        if: steps.head.outputs.current == 'true'
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      # release-please runs two phases: create releases for merged PRs still
      # labeled "autorelease: pending" (relabeling them "autorelease:
      # tagged"), then propose the next release PR. Phase 2 silently ABORTS
      # - green - while any pending label remains ("untagged, merged release
      # PRs outstanding"), so a pending label the action cannot clear parks
      # release-please with no red anywhere. Check AFTER the action so its
      # recovery phase always gets its turn first: a label still pending
      # here survived a real attempt. The 30-minute grace covers labels
      # legitimately still pending right after a merge (a parallel publish
      # pipeline, API eventual consistency).
      - name: Fail when a stale pending release PR parks release-please
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff="$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          stale="$(gh pr list --state merged --label 'autorelease: pending' \
            --limit 100 --json number,mergedAt \
            --jq "[.[] | select(.mergedAt < \"$cutoff\") | \"#\\(.number)\"] | join(\", \")")"
          if [ -n "$stale" ]; then
            echo "::error::merged release PR(s) $stale have worn 'autorelease: pending' for over 30 minutes, so release-please refuses to propose any new release ('untagged, merged release PRs outstanding'). Finish or abandon that release, then move the label to 'autorelease: tagged'."
            exit 1
          fi

  # Stage 2: the repo-owned hook. No permissions block here, so the hook
  # gets the calling job's full publishing ceiling (release assets, ghcr,
  # npm/PyPI trusted publishing); its jobs narrow it themselves.
  update-release:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/update-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  # Stage 3: attest the draft's assets and freeze the release. The gates
  # are runtime, not render-time, on purpose: assets are only knowable at
  # runtime, and a visibility flip between syncs must not block releasing
  # (GitHub attestations need a public repository or Enterprise Cloud, so
  # non-public releases publish unattested by fleet policy).
  publish-release:
    needs: [release-please, update-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # One probe answers everything: which assets are attestable, and
      # whether a prior attempt left a stale attestation.jsonl on the
      # draft. The stale bundle is deleted from the RELEASE, not a local
      # mirror, so no later skip path can ever publish it; a fresh one is
      # attached below when attestation runs.
      - name: Inspect the draft release's assets
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          if grep -qxF attestation.jsonl <<< "$names"; then
            gh release delete-asset "$TAG" attestation.jsonl --yes
          fi
          if [ -n "$(grep -vxF attestation.jsonl <<< "$names" || true)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the release has no assets; nothing to attest"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the assets for attestation
        id: download
        if: >-
          steps.assets.outputs.present == 'true'
          && github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets
      - uses: actions/attest-build-provenance@v4
        id: attest
        if: steps.download.outcome == 'success'
        with:
          subject-path: assets/*
      # Skipped along with the download and attest steps: bundle-path is
      # empty then, and a no-asset or non-public release publishes without
      # an attestation.jsonl (the probe above already removed any stale one).
      - name: Attach the attestation bundle to the draft
        if: steps.attest.outputs.bundle-path != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" attestation.jsonl
          gh release upload "$TAG" attestation.jsonl --clobber
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
        run: gh release edit "$TAG" --draft=false
