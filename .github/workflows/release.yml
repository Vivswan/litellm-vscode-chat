# Repo-owned release pipeline, called by the managed ci.yml on top of the
# all-green gate. Generated once by Vivswan/repo-platform and
# never overwritten by template sync.
#
# GitHub releases are immutable once published: the tag and assets freeze,
# and a post-publication `gh release upload` gets HTTP 422 (this killed the
# v0.4.1 asset). Every release therefore moves through the same three
# steps, always draft-first:
#   1. release-please cuts the release as a DRAFT with its tag already
#      forced (`draft` + `force-tag-creation` in release-please-config.json).
#   2. update-release mutates the draft: this repository's packaging,
#      asset uploads, and note edits go there.
#   3. publish-release flips the draft live. It stays the last job: list
#      every job that mutates the release in its `needs`.
# If the pipeline dies after the draft exists, a rerun cannot recreate it
# (release-please sees the forced tag); finish by hand:
#   gh release upload <tag> extension.vsix --clobber
#   gh release edit <tag> --draft=false
# Everything runs in the same workflow run, so it works with the default
# GITHUB_TOKEN too, which cannot trigger `on: release` workflows.

name: Release

on:
  workflow_call:

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    secrets: inherit

  # Step 2: package the released tag and publish it: VSIX to the VS Code
  # Marketplace (MARKETPLACE_TOKEN is an Azure DevOps PAT) and as a draft
  # release asset. vscode:prepublish runs the production typecheck, the
  # Rolldown bundle, and the ThirdPartyNotices generation. If a step fails
  # after the Marketplace publish, the release stays an invisible draft;
  # finish by hand as the header describes.
  update-release:
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # also what makes the draft visible to gh
      # For the VSIX provenance attestation below; within the managed
      # ci.yml release ceiling.
      id-token: write
      attestations: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Type-check and bundle the extension
        run: bun run vscode:prepublish

      - name: Package VSIX
        run: bunx vsce package -o extension.vsix

      # Build provenance for the published artifact: verifiable with
      # `gh attestation verify extension.vsix -R Vivswan/litellm-vscode-chat`.
      # Attestations only work on public repositories (private needs GitHub
      # Enterprise Cloud).
      - name: Attest the VSIX build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ./extension.vsix

      - name: Publish to VS Code Marketplace
        run: bunx vsce publish --pat "$MARKETPLACE_TOKEN" --packagePath ./extension.vsix
        env:
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}

      # The Sigstore bundle ships next to the VSIX so it can be verified
      # against the frozen release without depending on GitHub's attestations
      # API: `gh attestation verify extension.vsix
      # -R Vivswan/litellm-vscode-chat --bundle attestation.jsonl`.
      - name: Attach VSIX to the draft release
        run: |
          cp "$BUNDLE" attestation.jsonl
          gh release upload "$RELEASE_TAG" extension.vsix \
            attestation.jsonl --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}

  # Step 3: freeze the release. This job stays last.
  publish-release:
    needs: [release-please, update-release]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false
