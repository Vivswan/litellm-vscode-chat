# Manual docker-stack runs. The suite was promoted into checks.yml (inside
# the all-green gate) after its burn-in streak on main; this workflow stays
# for on-demand dispatch only, so pushes and PRs do not run it twice.
# nightly.yml still runs the docker suites at high iteration counts.

name: Docker Stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-stack:
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'ubuntu-latest'
      suite: 'docker'
