# Nightly fuzzing on the repo-platform fuzzer starter; repo-platform's
# docs/fuzzer.md documents the failure-report contract the fuzz steps follow.
# The night is split into parallel single-purpose legs (one matrix row each):
# four legs fuzz the unit property suites (widened from three when the
# settings redesign added the matcher, inheritance, and migration property
# families - more distinct seeds over a larger property surface), three fuzz
# the seeded docker suites (stream fuzzer, conversation walks, monkey walks),
# and one runs the remaining unseeded docker suites once - they draw no seed,
# so repeating them buys nothing. Every seeded leg gets its own deterministic
# seed derived from the run id, so the legs explore disjoint inputs and a
# night's coverage is the sum over legs. A failing leg writes a report naming
# the leg (and, when seeded, its seed), with the exact replay command, under
# .fuzz-failures/<leg>/; the report job merges every failing leg's report
# into the one label-deduplicated nightly-fuzz tracking issue. A green
# night closes it.

name: Nightly Fuzz

on:
  schedule:
    - cron: '59 7 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Fuzz seed (blank derives a distinct seed per leg; a value replays verbatim on every leg)
        required: false
        default: ''
      iterations:
        description: Property-test runs per suite (unit legs)
        required: false
        default: '1000'

# Scheduled runs supersede an in-flight scheduled run, but every manual
# dispatch gets its own group so several fuzz passes (each with its own
# derived seeds) can run side by side.
concurrency:
  group: nightly-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# issues: write lets the fuzz-issue action file/close the tracking issue;
# actions: write lets the failure path dispatch auto-assign at it.
permissions:
  contents: read
  issues: write
  actions: write

jobs:
  fuzz:
    name: fuzz (${{ matrix.leg }})
    runs-on: ubuntu-latest
    # A job that hits this timeout is cancelled, not failed, and the
    # failure-reporting path never runs - so every fuzz command below is
    # wrapped in `timeout --kill-after` (TERM, then KILL for a TERM-ignoring
    # extension host) with budgets that leave room for setup and upload.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One row per leg. `family` picks the step below (unit legs take
      # FUZZ_SEED/FUZZ_RUNS through `bun run test`; docker legs take
      # FUZZ_SEED plus the per-suite iteration counts through `test:docker`,
      # seeded rows naming their labels via --only and the unseeded row
      # running everything else via skip flags), and `salt` keeps the
      # derived seeds distinct across legs. A future fuzz family is one
      # appended row - another unit or docker row with a fresh salt, or a
      # new `family` value with its own step. Legs are sized to land in one
      # time class: the seeded docker labels share a leg (the monkey walks
      # dominate it), and the short unseeded suites share the last one.
      matrix:
        include:
          - leg: unit-1
            family: unit
            salt: 1
          - leg: unit-2
            family: unit
            salt: 2
          - leg: unit-3
            family: unit
            salt: 3
          - leg: unit-4
            family: unit
            salt: 8
          - leg: docker-seeded-1
            family: docker
            labels: docker-fuzz,docker-conversation,docker-monkey
            seeded: true
            salt: 4
          - leg: docker-seeded-2
            family: docker
            labels: docker-fuzz,docker-conversation,docker-monkey
            seeded: true
            salt: 5
          - leg: docker-seeded-3
            family: docker
            labels: docker-fuzz,docker-conversation,docker-monkey
            seeded: true
            salt: 6
          # The unseeded suites ignore FUZZ_SEED; the salt stays unique so
          # flipping `seeded` can never collide with another leg.
          - leg: docker-unseeded
            family: docker
            seeded: false
            salt: 7
    steps:
      # One derivation for every leg: a dispatched seed replays verbatim on
      # every leg, a blank one derives per-leg seeds from the run id -
      # deterministic for the night (a re-run attempt replays the same
      # seeds) and distinct across legs. Non-numeric input is rejected:
      # passed through, every suite would drop to its own fallback (the
      # unit legs all to the same pinned default) and the legs would repeat
      # each other instead of adding coverage. First on purpose - it needs
      # no checkout or toolchain, so a bad dispatch input or matrix row
      # fails before eight runners spend setup time.
      - name: Validate the leg and derive its seed
        shell: bash
        env:
          SEED_INPUT: ${{ inputs.seed }}
          FAMILY: ${{ matrix.family }}
          SALT: ${{ matrix.salt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$FAMILY" in
            unit|docker) ;;
            # A row whose family matches no fuzz step below would run
            # nothing and still count green; a new family extends this list
            # together with its step.
            *)
              echo "::error::unknown fuzz family '$FAMILY'"
              exit 1
              ;;
          esac
          case "$SEED_INPUT" in
            '') SEED=$(( (RUN_ID + SALT * 7919) % 1000000 )) ;;
            *[!0-9]*)
              echo "::error::seed must be decimal digits, got '$SEED_INPUT'"
              exit 1
              ;;
            *) SEED="$SEED_INPUT" ;;
          esac
          echo "SEED=$SEED" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Fuzz the unit property suites
        if: matrix.family == 'unit'
        shell: bash
        env:
          ITERATIONS: ${{ inputs.iterations || '1000' }}
          LEG: ${{ matrix.leg }}
        run: |
          echo "leg $LEG: seed $SEED, $ITERATIONS runs"
          set +e
          FUZZ_SEED="$SEED" FUZZ_RUNS="$ITERATIONS" timeout --kill-after=60 15m xvfb-run -a bun run test 2>&1 | tee nightly-unit.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            dir=".fuzz-failures/$LEG"
            mkdir -p "$dir"
            cp nightly-unit.log "$dir/" || true
            {
              echo "# Unit property suites failed (leg $LEG, seed $SEED)"
              echo
              echo "Replay:"
              echo
              echo '```bash'
              echo "FUZZ_SEED=$SEED FUZZ_RUNS=$ITERATIONS bun run test"
              echo '```'
              echo
              echo "fast-check prints the shrunk counterexample in the attached log."
              echo "Pin it as an example test next to the failing property, or in"
              echo "src/test/fuzzCorpus.ts when it is a FuzzEvent[] stream."
              echo
              echo "bun run test also runs the unseeded webview, activation-production,"
              echo "and capture host-fidelity suites; if the log blames one of those,"
              echo "the seed guidance above does not apply."
            } > "$dir/report.md"
            exit "$status"
          fi

      - name: Fuzz the docker suites
        if: matrix.family == 'docker'
        shell: bash
        env:
          LEG: ${{ matrix.leg }}
          LABELS: ${{ matrix.labels }}
          SEEDED: ${{ matrix.seeded }}
          FUZZ_ITERATIONS: '500'
          CONVERSATION_ITERATIONS: '50'
          MONKEY_ITERATIONS: '40'
        run: |
          if [ "$SEEDED" = "true" ]; then
            # Explicit for every suite in the leg (resolveDockerFuzzSeed
            # replays an explicit FUZZ_SEED exactly), so one seed reproduces
            # the whole leg and legs never overlap.
            export FUZZ_SEED="$SEED"
            set -- --only "$LABELS"
          else
            # Skip flags rather than --only: the unseeded leg runs the
            # complement of the seeded labels, so a label added to
            # DOCKER_TEST_LABELS is picked up here automatically instead of
            # silently never running at night.
            set -- --skip-fuzz --skip-conversation --skip-monkey
          fi
          echo "leg $LEG: test:docker $*${FUZZ_SEED:+, seed $FUZZ_SEED}"
          set +e
          # 45m covers the seeded leg, whose 40 monkey walks dominate; the
          # unseeded leg finishes far under it. A step killed by this timeout
          # still files an issue naming the leg (and, when seeded, its seed).
          timeout --kill-after=60 45m xvfb-run -a bun run test:docker "$@" 2>&1 | tee nightly-docker.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # The orchestrator runs the leg's suites in sequence; the mode of
            # the last "[fuzz] seed=... mode=..." line names the suite that
            # logged it. The line format is owned by src/test/fuzzSeed.ts
            # (fuzzSeedLine), and fuzzSeed.test.ts pins it against these
            # exact patterns. On a seeded leg the grepped seed equals $SEED
            # (FUZZ_SEED was explicit); the fallback covers a failure before
            # any suite logged.
            fuzzline="$(grep -oE '\[fuzz\] seed=[0-9]+[^"]*' nightly-docker.log | tail -1 || true)"
            seed="$(printf '%s' "$fuzzline" | grep -oE 'seed=[0-9]+' | grep -oE '[0-9]+' || true)"
            mode="$(printf '%s' "$fuzzline" | grep -oE 'mode=[a-z-]+' | cut -d= -f2 || true)"
            dir=".fuzz-failures/$LEG"
            mkdir -p "$dir"
            cp nightly-docker.log "$dir/" || true
            if [ "$SEEDED" = "true" ]; then
              {
                echo "# Docker leg $LEG failed (mode ${mode:-unknown}, seed ${seed:-$SEED})"
                echo
                echo "Replay:"
                echo
                echo '```bash'
                echo "FUZZ_SEED=${seed:-$SEED} FUZZ_ITERATIONS=$FUZZ_ITERATIONS CONVERSATION_ITERATIONS=$CONVERSATION_ITERATIONS MONKEY_ITERATIONS=$MONKEY_ITERATIONS bun run test:docker --only $LABELS"
                echo '```'
                echo
                echo "Every suite in this leg ran under the same explicit seed, so the"
                echo "command replays the whole leg; the mode names the suite that"
                echo "logged last (keep FUZZ_SEED and narrow --only to that suite's"
                echo "label to skip the rest). A seeded failure report includes a"
                echo "minimal failing event list; pin it in src/test/fuzzCorpus.ts so"
                echo "the case replays on every run."
              } > "$dir/report.md"
            else
              {
                echo "# Docker leg $LEG failed (unseeded suites)"
                echo
                echo "Replay:"
                echo
                echo '```bash'
                echo "bun run test:docker $*"
                echo '```'
                echo
                echo "These suites draw no fuzz seed; see the attached log for the"
                echo "failing suite."
              } > "$dir/report.md"
            fi
            exit "$status"
          fi

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures-${{ matrix.leg }}-${{ github.run_attempt }}
          path: .fuzz-failures/
          # .fuzz-failures is a dot-directory, and upload-artifact skips hidden
          # paths by default (since v4.4.0) - without this flag the upload
          # finds nothing and the report job files its bare no-report notice.
          include-hidden-files: true
          # warn, not ignore: a leg that failed before writing a report is
          # legitimate (setup died), but it should say so in the step log.
          if-no-files-found: warn

  # Report and resolve live outside the leg matrix on purpose: as steps of
  # a matrixed job they race, and one leg's green resolve could close the
  # issue another leg just filed. A failing night files (or updates) the
  # issue - each failing leg's report becomes its own section, so several
  # red legs land in one issue instead of spamming; cancelled contexts (a
  # superseding scheduled run, a manual cancel, and on some runner versions
  # a leg cancelled at the job timeout) skip filing - the `timeout
  # --kill-after` wrappers above are what keep a hang from ever reaching
  # the job timeout in the first place.
  report:
    needs: fuzz
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Every gh call in this job needs an explicit repo context: the job
      # never checks out the repo, so gh cannot resolve one from a git remote.
      # This covers the fuzz-issue action's internal gh calls too.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download failure artifacts
        if: needs.fuzz.result != 'success'
        # Tolerate a night where no leg produced a report (setup died before
        # fuzzing): the action then files its bare no-report notice instead of
        # this step failing on an empty pattern match.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: fuzz-failures-*
          path: .fuzz-failures
          merge-multiple: true

      - name: File or update the fuzz issue
        id: file-issue
        if: needs.fuzz.result != 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: report
          label: nightly-fuzz
          title: Nightly fuzz failures
          artifacts-dir: .fuzz-failures
          artifact-name: fuzz-failures-*

      # A GITHUB_TOKEN-created issue fires no triggers, so dispatch auto-assign.
      - name: Trigger auto-assign for the filed issue
        if: needs.fuzz.result != 'success' && steps.file-issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.file-issue.outputs.issue-number }}
        run: gh workflow run auto-assign.yml -f "issue=$ISSUE_NUMBER" || echo "::warning::could not dispatch auto-assign.yml"

      - name: Close the fuzz issue on a green night
        if: needs.fuzz.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: resolve
          label: nightly-fuzz
