# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# Without REPO_PLATFORM_TOKEN the run warns and skips. No heal cron here:
# Vivswan/repo-platform's central settings-repos run applies
# this repository's settings regardless of this workflow.

name: Settings Sync

on:
  push:
    branches: [main]
    paths: [.github/settings.yml]
  workflow_dispatch:
    inputs:
      check_only:
        description: Report drift without writing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    uses: Vivswan/repo-platform/.github/workflows/reusable-apply-settings.yml@build
    with:
      check_only: ${{ inputs.check_only || false }}
    secrets:
      REPO_PLATFORM_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
