name: Format Check (Reusable)

# No workflow_dispatch: the packaged-file-list check consumes the catalog
# artifact a sibling job of the caller uploads (checks.yml's
# openrouter-catalog), so this workflow cannot run on its own; a manual run
# is ci.yml's workflow_dispatch, which runs the whole gate.
on:
  workflow_call:
    inputs:
      catalog-artifact:
        description: 'Name of the artifact holding the validated dist/openrouter-models.json (uploaded by checks.yml openrouter-catalog)'
        required: true
        type: string
      catalog-outcome:
        description: >-
          The openrouter-catalog job's catalog output: fetched (the artifact exists) or skipped (a push
          build's lenient mode got no usable catalog from OpenRouter - transient or settled, the producer's
          own warning says which - and uploaded nothing)
        required: true
        type: string

jobs:
  format-check:
    permissions:
      contents: read
    # Generous against the observed few-minute runs; the alternative is
    # GitHub's 360-minute default when a step hangs.
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Check formatting and lint
        run: bunx biome ci --max-diagnostics=none .

      - name: Type-check helper scripts
        run: bunx tsc --noEmit -p tsconfig.scripts.json

      - name: Type-aware promise linting
        run: bun run lint:types

      - name: Check the localization catalogs
        run: bun run l10n:check

      # The generators' --check modes: each shipped output must be what its generator writes today, so a setting spec,
      # a zod envelope, or a prose table edited without a regeneration fails here instead of shipping a stale twin.
      - name: The generated settings reference must not have drifted
        run: bun run docs:settings:check

      - name: The generated manifest blocks must not have drifted
        run: bun run manifest:check

      - name: Verify @types/vscode does not exceed engines.vscode
        # The same script .husky/pre-commit runs, so a local green predicts this gate.
        run: bun scripts/ci/check-vscode-types.ts

      - name: Output-channel writes outside the Logger must not exist
        # The same script .husky/pre-commit runs through check:static, so a local green predicts this gate.
        run: bun scripts/ci/check-output-channel-writes.ts

      # The OpenRouter catalog arrives from the openrouter-catalog job of the
      # caller (the run's one live fetch, validated there) rather than from a
      # second fetch here. Judged by the next step so the failure names its
      # cause and its producer; the action's own not-found error would fail
      # the job with no pointer to either.
      - name: Download the validated OpenRouter catalog
        id: catalog
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.catalog-artifact }}
          path: dist

      # Fails closed with one declared gap; a missing artifact passes only when the producer reported catalog=skipped, nothing here
      # re-classifies its warning, and a re-run whose earlier attempt did upload finds that same-commit artifact and posts none.
      # Bundling still runs without the catalog, because builds are network-free by design and the runtime tolerates a missing one.
      - name: The catalog artifact must have arrived unless the producer reported catalog=skipped
        id: present
        env:
          ARTIFACT: ${{ inputs.catalog-artifact }}
          OUTCOME: ${{ steps.catalog.outcome }}
          PRODUCER: ${{ inputs.catalog-outcome }}
        run: |
          if [ "$OUTCOME" = "success" ] && [ -s dist/openrouter-models.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "dist/openrouter-models.json arrived from the '${ARTIFACT}' artifact ($(wc -c < dist/openrouter-models.json | tr -d ' ') bytes)"
          elif [ "$PRODUCER" = "skipped" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the openrouter-catalog job reported catalog=skipped on this push (OpenRouter did not" \
              "deliver a usable catalog; its own warning names the cause); bundling without" \
              "dist/openrouter-models.json and skipping its packaged-file-list assertions"
          else
            echo "::error::dist/openrouter-models.json did not arrive from the '${ARTIFACT}' artifact (download" \
              "outcome: ${OUTCOME}, producer outcome: ${PRODUCER}); checks.yml's openrouter-catalog job is its only" \
              "producer and this job never fetches the catalog itself - if the artifact expired, re-run all jobs"
            exit 1
          fi

      # The dev compile puts out/ on disk first, so the listing proves .vscodeignore excludes it rather than passing
      # because the files were never built. With the downloaded catalog on disk the listing is the exact file set a
      # release build packages; after the producer reported catalog=skipped the script skips that file's assertions.
      - name: Verify the packaged file list stays clean
        env:
          CATALOG_PRESENT: ${{ steps.present.outputs.present }}
        run: |
          bun run compile
          bun run bundle
          bun scripts/ci/check-packaged-files.ts

      # No PNGs in git. The dashboard's pixel baselines used to live here as
      # 37 tracked PNGs; they were purged from history, and images that churn
      # on every render have no business in a text repository. Screenshots for
      # design review come from CI artifacts and the local harness, never from
      # a commit. assets/ is the one legitimate home (the extension icon ships
      # in the package), so the guard is scoped rather than absolute. icase
      # because a pathspec is case-sensitive by default and .PNG would slip by,
      # and no `|| true`: a git failure must fail the step, not pass it.
      - name: No PNGs tracked outside assets/
        run: |
          tracked="$(git ls-files ':(icase)*.png' ':!:assets/**')"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::PNG files are tracked outside assets/ (listed above); keep them out of git"
            exit 1
          fi
