name: Format Check (Reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

jobs:
  format-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/setup-env.sh

      - name: Check formatting and lint
        run: bunx biome ci .

      - name: Type-check helper scripts
        run: bunx tsc --noEmit -p tsconfig.scripts.json

      - name: Check for unused files, exports, and dependencies
        run: bun run lint:knip

      - name: Type-aware promise linting
        run: bun run lint:types

      - name: Verify @types/vscode matches engines.vscode
        run: |
          node -e "
          const pkg = require('./package.json');
          const expected = '^' + pkg.engines.vscode.replace(/^[~^<>=\s]+/, '');
          const actual = pkg.devDependencies['@types/vscode'];
          if (actual !== expected) {
            console.error('@types/vscode must be ' + expected + ' to match engines.vscode, got ' + actual);
            process.exit(1);
          }
          console.log('@types/vscode matches engines.vscode: ' + actual);
          "

      # The dev compile puts out/ on disk first, so this proves .vscodeignore
      # excludes it rather than passing because the files were never built.
      - name: Verify the packaged file list stays clean
        run: |
          bun run compile
          bun run bundle
          listing="$(bunx vsce ls)"
          echo "$listing"
          forbidden='^(out/|src/|node_modules/|scripts/|\.github/|\.husky/)|^(bun\.lock|biome\.json|AGENTS\.md|CLAUDE\.md|\.vscode-test\.mjs)$|\.ts$|\.map$'
          if echo "$listing" | grep -E "$forbidden"; then
            echo "::error::vsce would package files that must stay out of the VSIX (matches above)"
            exit 1
          fi
          if ! echo "$listing" | grep -qx 'dist/extension.js'; then
            echo "::error::dist/extension.js is missing from the packaged file list"
            exit 1
          fi
          if ! echo "$listing" | grep -qx 'ThirdPartyNotices.txt'; then
            echo "::error::ThirdPartyNotices.txt is missing from the packaged file list"
            exit 1
          fi
          if echo "$listing" | grep -E '^dist/' | grep -vx 'dist/extension.js'; then
            echo "::error::unexpected files under dist/ would be packaged (matches above)"
            exit 1
          fi
          echo "Packaged file list is clean ($(echo "$listing" | wc -l | tr -d ' ') files)"
