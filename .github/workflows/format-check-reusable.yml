name: Format Check (Reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''

jobs:
  format-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Check formatting and lint
        run: bunx biome ci --max-diagnostics=none .

      - name: Type-check helper scripts
        run: bunx tsc --noEmit -p tsconfig.scripts.json

      - name: Check for unused files, exports, and dependencies
        run: bun run lint:knip

      - name: Type-aware promise linting
        run: bun run lint:types

      - name: Check the localization catalogs
        run: bun run l10n:check

      - name: Verify @types/vscode does not exceed engines.vscode
        run: |
          node -e "
          const parse = (value, label) => {
            const m = /^(\d+)\.(\d+)\.(\d+)/.exec(String(value).replace(/^[~^>=\s]+/, ''));
            if (!m) {
              console.error('Cannot parse ' + label + ': ' + value);
              process.exit(1);
            }
            return [Number(m[1]), Number(m[2])];
          };
          const engines = parse(require('./package.json').engines.vscode, 'engines.vscode');
          const installed = require('@types/vscode/package.json').version;
          const types = parse(installed, 'installed @types/vscode');
          if (types[0] !== engines[0] || types[1] > engines[1]) {
            console.error('Installed @types/vscode (' + installed + ') must not be newer than engines.vscode (' + require('./package.json').engines.vscode + '): newer typings would allow APIs the minimum supported host lacks');
            process.exit(1);
          }
          console.log('Installed @types/vscode ' + installed + ' is within engines.vscode ' + require('./package.json').engines.vscode);
          "

      # The dev compile puts out/ on disk first, so this proves .vscodeignore
      # excludes it rather than passing because the files were never built.
      # logs/ and coverage/ get seeded the same way: the dev launcher and
      # test:coverage write them locally but nothing in this job does, so
      # without the seeding their exclusion would never actually be exercised.
      # The strict catalog fetch mirrors vscode:prepublish, so the listing
      # below checks the exact file set a release build would package.
      - name: Verify the packaged file list stays clean
        run: |
          bun run compile
          bun scripts/dev/fetch-openrouter-catalog.ts
          bun run bundle
          mkdir -p logs coverage
          touch logs/ci-proof.log coverage/ci-proof.json
          listing="$(bunx vsce ls)"
          echo "$listing"
          # Allowlist, not denylist: the package is a small known file set,
          # and a denylist only catches leaks someone predicted (the
          # repo-tooling files it missed shipped in a VSIX before anyone
          # noticed). Anything new must be added here deliberately, including
          # new asset types and new localization catalogs. POSIX bracket
          # expressions treat \w literally, hence the spelled-out class.
          allowed='^(package\.json|README\.md|CHANGELOG\.md|LICENSE\.md|ThirdPartyNotices\.txt|dist/extension\.js|dist/webview/dashboard\.js|dist/webview/dashboard\.css|dist/openrouter-models\.json)$|^assets/.+\.(png|md)$|^package\.nls(\.[A-Za-z0-9_-]+)?\.json$|^l10n/bundle\.l10n(\.[A-Za-z0-9_-]+)?\.json$'
          if echo "$listing" | grep -Ev "$allowed"; then
            echo "::error::vsce would package files outside the allowed set (matches above)"
            exit 1
          fi
          if ! echo "$listing" | grep -qx 'dist/extension.js'; then
            echo "::error::dist/extension.js is missing from the packaged file list"
            exit 1
          fi
          if ! echo "$listing" | grep -qx 'dist/webview/dashboard.js'; then
            echo "::error::dist/webview/dashboard.js is missing from the packaged file list"
            exit 1
          fi
          if ! echo "$listing" | grep -qx 'dist/webview/dashboard.css'; then
            echo "::error::dist/webview/dashboard.css is missing from the packaged file list"
            exit 1
          fi
          # The OpenRouter catalog artifact must ship AND carry a real model
          # set: a size floor alone cannot catch a semantically empty file.
          # The floor is read from CATALOG_MODEL_COUNT_FLOOR so it cannot
          # drift from the fetch script's own validation.
          if ! echo "$listing" | grep -qx 'dist/openrouter-models.json'; then
            echo "::error::dist/openrouter-models.json is missing from the packaged file list"
            exit 1
          fi
          catalog_floor="$(bun -e 'console.log(require("./src/shared/config/openRouterCatalog.ts").CATALOG_MODEL_COUNT_FLOOR)')"
          catalog_count="$(jq '.data | length // 0' dist/openrouter-models.json)"
          if ! [[ "$catalog_count" =~ ^[0-9]+$ ]] || [ "$catalog_count" -lt "$catalog_floor" ]; then
            echo "::error::dist/openrouter-models.json parses to ${catalog_count} models (floor ${catalog_floor})"
            exit 1
          fi
          # The catalog is capabilities-only: pricing never rides it (LiteLLM
          # is the only pricing source), so a pricing key in the shipped
          # artifact means the slim encoder regressed or a stale file slipped
          # into the package.
          catalog_priced="$(jq '[.data[] | has("pricing")] | any' dist/openrouter-models.json)"
          if [ "$catalog_priced" != "false" ]; then
            echo "::error::dist/openrouter-models.json carries pricing keys; the catalog is capabilities-only"
            exit 1
          fi
          # The localization catalogs must ship: without package.nls.json the
          # host renders raw %key% placeholders, and without the English
          # bundle vscode.l10n and the webview injection have nothing to read.
          if ! echo "$listing" | grep -qx 'package.nls.json'; then
            echo "::error::package.nls.json is missing from the packaged file list"
            exit 1
          fi
          if ! echo "$listing" | grep -qx 'l10n/bundle.l10n.json'; then
            echo "::error::l10n/bundle.l10n.json is missing from the packaged file list"
            exit 1
          fi
          # The webview suite renders source .tsx, never the bundled output, so
          # a bundler regression could ship a blank dashboard with every test
          # green. The real dashboard weighs ~405,936 bytes minified (React 19
          # inlined; even a blank render carries react-dom), so the 40000
          # floor guards a truncated or empty emit and the greps are the
          # content gate: these strings only survive if the real dashboard
          # components compiled into the bundle.
          webview_size="$(wc -c < dist/webview/dashboard.js | tr -d ' ')"
          if [ "$webview_size" -lt 40000 ]; then
            echo "::error::dist/webview/dashboard.js is only ${webview_size} bytes; the dashboard bundle looks broken"
            exit 1
          fi
          for marker in 'LiteLLM Dashboard' 'readInlineSecrets' 'saveServerSetting'; do
            if ! grep -q "$marker" dist/webview/dashboard.js; then
              echo "::error::dist/webview/dashboard.js lacks '${marker}'; the dashboard did not compile into the bundle"
              exit 1
            fi
          done
          # The bundle script's NODE_ENV define decides which React build
          # ships, and the size check above is a floor, so a development
          # build would pass it silently. The define must have replaced every
          # process.env.NODE_ENV read, and React's dev-only warning text must
          # not survive a production bundle.
          for banned in 'process.env.NODE_ENV' 'Each child in a list'; do
            if grep -q "$banned" dist/webview/dashboard.js; then
              echo "::error::dist/webview/dashboard.js contains '${banned}'; the production bundle looks like a development build"
              exit 1
            fi
          done
          # The stylesheet is the same kind of test-invisible build output as
          # the bundle (the webview suite never loads the bundled css either):
          # the real emit weighs ~47,070 bytes minified (~56,389 unminified,
          # Tailwind theme block included),
          # so 30000 fails a truncated or empty emit with headroom, and the
          # grep pins the theme-token contract - every rule reads the host's
          # var(--vscode-*) tokens.
          stylesheet_size="$(wc -c < dist/webview/dashboard.css | tr -d ' ')"
          if [ "$stylesheet_size" -lt 30000 ]; then
            echo "::error::dist/webview/dashboard.css is only ${stylesheet_size} bytes; the dashboard stylesheet looks broken"
            exit 1
          fi
          if ! grep -q 'var(--vscode-' dist/webview/dashboard.css; then
            echo "::error::dist/webview/dashboard.css lacks the host theme tokens; the real stylesheet did not bundle"
            exit 1
          fi
          # The dashboard rules alone clear the size floor, so the Tailwind
          # theme block needs its own presence marker: the semantic --primary
          # token only exists if the Tailwind leg of the bundle ran.
          if ! grep -q -- '--primary' dist/webview/dashboard.css; then
            echo "::error::dist/webview/dashboard.css lacks the Tailwind theme block; the Tailwind bundle leg did not run"
            exit 1
          fi
          if ! echo "$listing" | grep -qx 'ThirdPartyNotices.txt'; then
            echo "::error::ThirdPartyNotices.txt is missing from the packaged file list"
            exit 1
          fi
          echo "Packaged file list is clean ($(echo "$listing" | wc -l | tr -d ' ') files)"

      # No PNGs in git. The dashboard's pixel baselines used to live here as
      # 37 tracked PNGs; they were purged from history, and images that churn
      # on every render have no business in a text repository. Screenshots for
      # design review come from CI artifacts and the local harness, never from
      # a commit. assets/ is the one legitimate home (the extension icon ships
      # in the package), so the guard is scoped rather than absolute. icase
      # because a pathspec is case-sensitive by default and .PNG would slip by,
      # and no `|| true`: a git failure must fail the step, not pass it.
      - name: No PNGs tracked outside assets/
        run: |
          tracked="$(git ls-files ':(icase)*.png' ':!:assets/**')"
          if [ -n "$tracked" ]; then
            echo "$tracked"
            echo "::error::PNG files are tracked outside assets/ (listed above); keep them out of git"
            exit 1
          fi
