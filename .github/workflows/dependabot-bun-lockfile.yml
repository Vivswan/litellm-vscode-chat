# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# Dependabot bumps the target package but leaves stale nested bun.lock
# entries behind, so `bun install --frozen-lockfile` fails with
# mixed-version errors; this regenerates the lockfile on Dependabot's own
# PRs. --lockfile-only runs no lifecycle scripts next to the write
# credential. Register REPO_PLATFORM_TOKEN as a DEPENDABOT secret so the
# fix commit re-runs CI (github.token starts no workflows).

name: Dependabot Bun Lockfile

on:
  pull_request:
    paths: ["**/bun.lock", "**/package.json"]

permissions:
  contents: read

# Dependabot force-pushes on rebase, so only the newest run per PR and
# actor proceeds; the actor keeps the fix push's own run from cancelling
# the finishing original.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  dedupe:
    # Dependabot's own pushes only (the fix commit and human pushes must
    # not re-fire it); same-repo only: the token cannot push to a fork.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write # the no-retrigger-token PR comment below
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # Every tracked lockfile ('*/bun.lock' is a git pathspec; '*'
      # crosses '/'). Delete before regenerating: bun keeps a stale
      # lockfile as a valid resolution, and only a from-scratch resolve
      # drops the stale entries.
      - name: Regenerate bun lockfiles
        shell: bash
        run: |
          git ls-files -z -- 'bun.lock' '*/bun.lock' | while IFS= read -r -d '' lock; do
            rm -- "$lock"
            bun install --lockfile-only --ignore-scripts --cwd "$(dirname -- "$lock")"
            # bun deletes an empty lockfile outright; keep the committed one.
            [ -f "$lock" ] || git checkout -- "$lock"
          done
      - name: Commit and push the deduped lockfiles
        shell: bash
        env:
          TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          CAN_RETRIGGER: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- 'bun.lock' '*/bun.lock'; then
            echo "lockfiles already deduped"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git ls-files -z -- 'bun.lock' '*/bun.lock' | xargs -0 git add --
          # [dependabot skip] keeps Dependabot rebasing and updating the
          # PR over this commit.
          git commit -m "build(deps): dedupe bun lockfile" -m "[dependabot skip]"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$HEAD_REF"
          if [ "$CAN_RETRIGGER" = "true" ]; then
            exit 0
          fi
          # github.token starts no workflows: say so on the PR (once) and
          # as an annotation, but stay green - the fleet legitimately runs
          # without the token.
          marker="<!-- dependabot-bun-lockfile: no-retrigger-token -->"
          comments=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' || true)
          case "$comments" in
            *"$marker"*) ;;
            *) gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$marker
          Pushed a lockfile dedupe commit with the default workflow token, which starts no workflows, so checks will not re-run on the new head. Close and reopen this PR to re-run them, or register \`REPO_PLATFORM_TOKEN\` as a Dependabot secret so future fixes re-trigger CI automatically." || true ;;
          esac
          echo "::warning::lockfile fix pushed without REPO_PLATFORM_TOKEN - checks will not re-run on the new head; close/reopen the PR or register the token as a Dependabot secret"
