# This file is managed by Vivswan/repo-platform.
# Local edits are replaced on the next sync.
#
# Dependabot bumps the target package but leaves stale nested bun.lock
# entries behind, so `bun install --frozen-lockfile` fails with
# mixed-version errors; the dedupe-bun-lockfile action regenerates the
# lockfile on Dependabot's own PRs. Register REPO_PLATFORM_TOKEN as a
# DEPENDABOT secret so the fix commit re-runs CI (github.token starts no
# workflows).

name: Dependabot Bun Lockfile

on:
  pull_request:
    paths: ["**/bun.lock", "**/package.json"]

permissions:
  contents: read

# Dependabot force-pushes on rebase, so only the newest run per PR and
# actor proceeds; the actor keeps the fix push's own run from cancelling
# the finishing original.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  dedupe:
    # Dependabot's own pushes only (the fix commit and human pushes must
    # not re-fire it); same-repo only: the token cannot push to a fork.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write # the sticky PR comment below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      # Regenerates every tracked lockfile from scratch, commits, and pushes
      # to the PR head; no_retrigger flags a push github.token made.
      - name: Regenerate, commit, and push the deduped lockfiles
        id: push
        uses: Vivswan/repo-platform/actions/dedupe-bun-lockfile@build
        with:
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          can-retrigger: ${{ secrets.REPO_PLATFORM_TOKEN != '' }}
          head-ref: ${{ github.event.pull_request.head.ref }}
      # One comment per PR, edited in place on later runs; a failed post
      # fails the step.
      - name: Comment that checks will not re-run
        if: steps.push.outputs.no_retrigger == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: repo-platform/dependabot-bun-lockfile
          message: >
            Pushed a lockfile dedupe commit with the default workflow token, which starts no workflows,
            so the new head's `pull_request` run waits for approval.
            Open it in the Actions tab and choose **Approve and run**, or push an empty commit.
            Durable fix: register `REPO_PLATFORM_TOKEN` as a Dependabot secret
            (Settings > Secrets and variables > Dependabot) so the push comes from the PAT and its run starts on its own.
