# Repo-owned CI checks, called by the managed ci.yml inside the all-green
# gate: every job here must pass before all-green goes green. Generated once
# by Vivswan/repo-platform and never overwritten by template
# sync, so edit freely: multiple jobs, matrices, and further local reusable
# workflows all work.
#
# Two limits from running inside the `checks` caller: jobs here get no
# secrets and are capped at the caller's permissions (contents: read), and
# all-green only sees the aggregate result, so a job skipped by its own
# `if:` does not fail the gate. A check that needs secrets, more
# permissions, or must never be skippable, belongs in its own workflow wired
# into the ruleset via .github/settings.yml.

name: Checks

on:
  workflow_call:

jobs:
  # The full `bun run test` pass (bun tree, unit, activation-production, and
  # both capture-mode host-fidelity suites) on all three OSes; the Linux leg
  # also enforces the source-line coverage floor.
  test:
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'matrix'

  # Promoted from its burn-in workflow after a long green streak on main:
  # docker suite, stream fuzzer, and live host-fidelity against the
  # dockerized LiteLLM proxy. Two shards, balanced from the per-label wall
  # times of main run 30593932251 (docker 41s + transport 62s against
  # serversync 15s + fuzz 5s + conversation 6s + host-fidelity 5s +
  # monkey 69s; the usage/budget smoke adds well under a second to shard
  # one, and the two split-off group suites - the provider-group chat path
  # on shard one, the capture-mode group-label round trip on shard two -
  # run sub-second each; their cost is one extra extension-host boot per
  # shard); the drift guard in src/test/stackDrift.test.ts
  # pins each list to the orchestrator's known labels and the union to the
  # full set. No `if:` on the shards: a skipped matrix job would count
  # green in the aggregate (see the header note).
  docker-stack:
    strategy:
      fail-fast: false
      matrix:
        labels:
          - 'docker,docker-usage,docker-transport,docker-resolution,docker-group-path'
          - 'docker-serversync,docker-fuzz,docker-conversation,host-fidelity,host-fidelity-groups,docker-monkey'
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'ubuntu-latest'
      suite: 'docker'
      docker-only: ${{ matrix.labels }}

  # Decides whether this push/PR touches fuzzer-related code; the fuzz job
  # below keys off the answer. Detection happens in-job because ci.yml calls
  # this workflow, so `on.paths` filtering is not available here.
  fuzz-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.diff.outputs.hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match changed files against the fuzzer paths
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          # pull_request carries the base sha; push carries the pre-push sha.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fuzzer-related: the stream and monkey fuzzers with their corpus
          # and seed plumbing, the fast-check property suites, the canned
          # stream scenarios, the fake stack the fuzzers drive, the streaming
          # transport whose leniency contract the fuzzer pins, the bun leg's
          # root and preload, which decide what the ported property suites
          # run under, and the orchestrator plus its label list, which decide
          # what --only runs.
          pattern='^src/test/(bun/)?(fuzz|monkey|scenarios|fakeStack/|docker-(fuzz|conversation|monkey)\.test\.ts)|^src/test/bun/preload\.ts$|^bunfig\.toml$|^src/provider/transport/streaming/|^scripts/stack/fake-openai-server\.ts$|^scripts/docker-test\.ts$|^src/test/dockerTestLabels\.ts$|\.property\.test\.ts$'
          if [ "$EVENT" != "push" ] && [ "$EVENT" != "pull_request" ]; then
            # Scheduled and dispatched gate runs have no diff to inspect.
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # First push of a branch or an unfetchable base: fuzz rather
            # than guess.
            echo "no usable diff base, running the fuzz pass"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A history rewrite can leave BASE present as an object but with no
          # merge base against HEAD; the three-dot diff dies fatally there.
          if ! changed="$(git diff --name-only "$BASE...HEAD" 2>/dev/null)"; then
            echo "no merge base with $BASE, running the fuzz pass"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  # Elevated fuzz passes in the gate when fuzzer-related code changes; on
  # everything else they skip, which the aggregate `checks` result reports
  # as success (see the header note). The counts sit well below
  # nightly-fuzz.yml's but far above the suite defaults, sized to shake out
  # a broken fuzzer, grammar, or corpus change before merge while staying
  # in the docker-stack job's time class. Failures just fail the job - the
  # replay seed is in the step log - and the nightly marathon keeps the
  # issue-filing coverage.
  fuzz-unit:
    needs: fuzz-paths
    if: needs.fuzz-paths.outputs.hit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history for the crediting-convention guard in the unit suite
          # (src/test/creditConvention.test.ts), same as test-reusable.yml.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Fuzz the unit property suites
        shell: bash
        run: |
          SEED="$RANDOM$RANDOM"
          echo "seed $SEED (replay: FUZZ_SEED=$SEED FUZZ_RUNS=500 bun run test)"
          FUZZ_SEED="$SEED" FUZZ_RUNS=500 xvfb-run -a bun run test

  # The docker half of the elevated fuzz pass, sharded next to fuzz-unit.
  # Only the seeded fuzz labels run here: the docker-stack shards in this
  # same gate already run every leg at default counts, so repeating the
  # non-fuzz legs would buy nothing. The drift guard pins these lists too.
  fuzz-docker:
    needs: fuzz-paths
    if: needs.fuzz-paths.outputs.hit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        labels:
          - 'docker-fuzz,docker-conversation'
          - 'docker-monkey'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Fuzz the docker stream suites
        env:
          # Each fuzzer draws and logs its own seed when FUZZ_SEED is unset;
          # the counts sit between the suite defaults and nightly's
          # 500/50/40.
          FUZZ_ITERATIONS: '100'
          CONVERSATION_ITERATIONS: '20'
          MONKEY_ITERATIONS: '10'
          DOCKER_ONLY: ${{ matrix.labels }}
        run: xvfb-run -a bun run test:docker --only "$DOCKER_ONLY"

  # The dashboard overflow sweep: every render fixture must fit sideways at
  # every width the stylesheet declares (exit 1 is a page that does not fit,
  # exit 2 a fixture that never ran - a stale step is its own failure). One
  # Linux leg only: the runners ship Chrome and the harness drives it over
  # raw CDP, so no other setup exists to vary by OS.
  check-overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Sweep the render fixtures for horizontal overflow
        env:
          # The image ships Chromium and Chrome both and discovery prefers the
          # first it finds; pin the one whose sandbox the runner's AppArmor
          # profile covers, so a failure can only ever mean layout.
          CHROME_BIN: /usr/bin/google-chrome
        run: bun run check-overflow

  # The geometry-drift sweep, check-overflow's sibling: every registered state
  # pair must keep its element's geometry across the state change (a modified
  # mark, a hover/focus reveal, a validation error), and every registered
  # surface must reach its declared right edge at 2000px (exit 1 is geometry
  # that moved, exit 2 a pair that never ran or a stale expectedDrift marker -
  # a stale entry is its own failure). Same one-Linux-leg reasoning as the
  # overflow sweep: the runners ship Chrome and the harness drives raw CDP.
  check-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Sweep the state pairs for geometry drift
        env:
          # The image ships Chromium and Chrome both and discovery prefers the
          # first it finds; pin the one whose sandbox the runner's AppArmor
          # profile covers, so a failure can only ever mean layout.
          CHROME_BIN: /usr/bin/google-chrome
        run: bun run check-geometry

  # The run's ONE live fetch of the OpenRouter capability catalog: the fetch
  # script validates the live payload and the mapping (so payload drift is
  # caught here instead of by users) and writes the slimmed
  # dist/openrouter-models.json, which this job hands to format-check's
  # packaged-file-list check as an artifact. format-check used to fetch the
  # same URL again on its own runner, and the two fetches doubled the exposure
  # to a CDN body stall for zero extra coverage (the second one validated the
  # same payload). The endpoint is unauthenticated and the failure text
  # distinguishes "unreachable (transient)" from "schema drift"; unconditional
  # on purpose (a skipped job would count green in the gate, see the header
  # note).
  openrouter-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # fetched or skipped; format-check tolerates a missing artifact only on
      # skipped.
      catalog: ${{ steps.fetch.outputs.catalog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Push-to-main runs opt into the script's lenient mode: an UNREACHABLE
      # OpenRouter (connect failure, header or body timeout, non-2xx, a body
      # that is not JSON - the script's own transient class) is one
      # ::warning:: annotation and exit 0 with nothing written, because a
      # third-party outage must not block landing on main; schema drift stays
      # fatal in every mode. Pull request runs, ci.yml's weekly schedule, and
      # manual dispatch stay fatal, so an outage is still caught loudly where
      # a human is watching and a re-run is cheap, and the release build's own
      # fetch (vscode:prepublish) stays fatal too. The file, not the exit
      # code, says whether the catalog was fetched.
      - name: Fetch and validate the live OpenRouter catalog
        id: fetch
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            set -- --unreachable-is-warning
          fi
          bun scripts/dev/fetch-openrouter-catalog.ts "$@"
          if [ -s dist/openrouter-models.json ]; then
            echo "catalog=fetched" >> "$GITHUB_OUTPUT"
          else
            echo "catalog=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the slimmed catalog for format-check
        if: steps.fetch.outputs.catalog == 'fetched'
        uses: actions/upload-artifact@v7
        with:
          name: openrouter-catalog
          path: dist/openrouter-models.json
          # The step above only reports fetched with the file on disk, so this
          # is a fail-closed backstop, not an expected path.
          if-no-files-found: error
          # Consumed within the run by format-check; nothing reads it later.
          retention-days: 1
          # Artifacts belong to the run, not the attempt, and v4+ artifacts are
          # immutable: "re-run all jobs" would otherwise 409 on the name the
          # previous attempt already uploaded. "Re-run failed jobs" when only
          # format-check failed leaves this job alone, and format-check
          # downloads the earlier attempt's artifact - until it expires, after
          # which re-run all jobs.
          overwrite: true

  # Biome ci, helper-script typecheck, knip, type-aware promise lint,
  # @types/vscode vs engines.vscode, and the packaged-file-list check. Waits
  # for the catalog job because the packaged-file-list check downloads its
  # artifact instead of fetching the catalog itself: the ordering cost is the
  # producer's runtime (typically about a minute; the fetch's retry ladder is
  # 80 s worst case, under the job's 5-minute cap) on a job that was never
  # the gate's critical path (the test matrix and docker-stack shards run far
  # longer).
  format-check:
    needs: openrouter-catalog
    uses: ./.github/workflows/format-check-reusable.yml
    with:
      catalog-artifact: openrouter-catalog
      catalog-outcome: ${{ needs.openrouter-catalog.outputs.catalog }}

  # All four tsconfig projects. The reusable format-check only typechecks
  # the helper scripts, the pre-commit hook likewise, and the bun test tree
  # and bundle are transpile-only - so without this job nothing automated
  # typechecks src/webview or src/test/bun at all (a broken webview
  # project once reached a merge commit through that gap).
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/env/setup-env.sh

      - name: Typecheck all four tsconfig projects
        run: bun run typecheck

  # Squash merge lands the PR title as the commit subject (settings.yml pins
  # PR_TITLE), so a crediting title never passes through the commit-msg hook
  # and is not yet in git log for the history guard's pre-merge run. This
  # checks the title against the PR's own ACKNOWLEDGMENTS.md before merge.
  pr-title-credit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: A crediting PR title has its ACKNOWLEDGMENTS.md row
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun scripts/ci/check-credit-rows.ts --subject "$PR_TITLE"
