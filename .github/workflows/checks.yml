# Repo-owned CI checks, called by the managed ci.yml inside the all-green
# gate: every job here must pass before all-green goes green. Generated once
# by Vivswan/repo-platform and never overwritten by template
# sync, so edit freely: multiple jobs, matrices, and further local reusable
# workflows all work.
#
# Two limits from running inside the `checks` caller: jobs here get no
# secrets and are capped at the caller's permissions (contents: read), and
# all-green only sees the aggregate result, so a job skipped by its own
# `if:` does not fail the gate. A check that needs secrets, more
# permissions, or must never be skippable, belongs in its own workflow wired
# into the ruleset via .github/settings.yml.

name: Checks

on:
  workflow_call:

jobs:
  # Unit suite plus the capture-mode host-fidelity suite on all three OSes;
  # the Linux leg also enforces the source-line coverage floor.
  test:
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'matrix'

  # Promoted from its burn-in workflow after a long green streak on main:
  # docker suite, stream fuzzer, and live host-fidelity against the
  # dockerized LiteLLM proxy.
  docker-stack:
    uses: ./.github/workflows/test-reusable.yml
    with:
      os: 'ubuntu-latest'
      suite: 'docker'

  # Decides whether this push/PR touches fuzzer-related code; the fuzz job
  # below keys off the answer. Detection happens in-job because ci.yml calls
  # this workflow, so `on.paths` filtering is not available here.
  fuzz-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.diff.outputs.hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Match changed files against the fuzzer paths
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          # pull_request carries the base sha; push carries the pre-push sha.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fuzzer-related: the stream and monkey fuzzers with their corpus
          # and seed plumbing, the fast-check property suites, the canned
          # stream scenarios, the fake stack the fuzzers drive, and the
          # streaming transport whose leniency contract the fuzzer pins.
          pattern='^src/test/(fuzz|monkey|scenarios|fakeStack/|docker-(fuzz|conversation|monkey)\.test\.ts)|^src/provider/streaming\.ts$|^scripts/fake-openai-server\.ts$|\.property\.test\.ts$'
          if [ "$EVENT" != "push" ] && [ "$EVENT" != "pull_request" ]; then
            # Scheduled and dispatched gate runs have no diff to inspect.
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # First push of a branch or an unfetchable base: fuzz rather
            # than guess.
            echo "no usable diff base, running the fuzz pass"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE...HEAD")"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

  # Elevated fuzz pass in the gate when fuzzer-related code changes; on
  # everything else it skips, which the aggregate `checks` result reports
  # as success (see the header note). One shard with per-suite counts well
  # below nightly-fuzz.yml's but far above the suite defaults, sized to
  # shake out a broken fuzzer, grammar, or corpus change before merge while
  # staying in the docker-stack job's time class. Failures just fail the
  # job - the replay seed is in the step log - and the nightly marathon
  # keeps the issue-filing coverage.
  fuzz:
    needs: fuzz-paths
    if: needs.fuzz-paths.outputs.hit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up development environment
        run: bash scripts/setup-env.sh

      - name: Fuzz the unit property suites
        shell: bash
        run: |
          SEED="$RANDOM$RANDOM"
          echo "seed $SEED (replay: FUZZ_SEED=$SEED FUZZ_RUNS=500 bun run test)"
          FUZZ_SEED="$SEED" FUZZ_RUNS=500 xvfb-run -a bun run test

      - name: Fuzz the docker stream suites
        env:
          # The docker fuzzer draws and logs its own seed when FUZZ_SEED is
          # unset; the counts sit between the suite defaults and nightly's
          # 500/50/40.
          FUZZ_ITERATIONS: '100'
          CONVERSATION_ITERATIONS: '20'
          MONKEY_ITERATIONS: '10'
        run: xvfb-run -a bun run test:docker

  # Biome ci, helper-script typecheck, knip, type-aware promise lint,
  # @types/vscode vs engines.vscode, and the packaged-file-list check.
  format-check:
    uses: ./.github/workflows/format-check-reusable.yml
